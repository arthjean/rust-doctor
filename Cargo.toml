[package]
name = "rust-doctor"
version = "0.9.0"
edition = "2024"
rust-version = "1.95"
description = "Local-first health audit for Cargo workspaces: curated Clippy lints and native detectors, scored out of 100"
license = "MIT OR Apache-2.0"
repository = "https://github.com/arthjean/rust-doctor"
homepage = "https://rust-doctor.com"
documentation = "https://docs.rs/rust-doctor"
readme = "README.md"
keywords = ["clippy", "lint", "code-quality", "health", "diagnostics"]
categories = ["development-tools", "command-line-utilities"]
exclude = [
    "npm/",
    "tasks/",
    "docs/",
    "scripts/",
    "tests/docs_contract.rs",
    "tests/comment_free.rs",
    "tests/e2e/",
    ".claude/",
    ".github/",
    "action.yml",
    "comment/",
]

[lib]
path = "src/lib.rs"

[[bin]]
name = "rust-doctor"
path = "src/main.rs"

[dependencies]
blake3 = "=1.8.5"
cargo_metadata = "=0.23.1"
clap = { version = "=4.6.4", features = ["derive"] }
console = "=0.15.11"
ra_ap_syntax = "=0.0.343"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
toml = { version = "=1.1.4", default-features = false, features = ["parse", "serde", "std"] }
unicode-width = "=0.2.2"
libc = "=0.2.189"

[profile.release]
overflow-checks = true

[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-{ target }.tar.gz"
bin-dir = "{ name }-{ target }/{ bin }{ binary-ext }"
pkg-fmt = "tgz"
disabled-strategies = ["quick-install"]

[lints.clippy]
panic = "deny"
unimplemented = "deny"
dbg_macro = "deny"
todo = "warn"
unwrap_used = "warn"
expect_used = "warn"
unwrap_in_result = "warn"
string_slice = "warn"
undocumented_unsafe_blocks = "warn"
