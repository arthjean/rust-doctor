name: Install

on:
  schedule:
    - cron: "41 5 * * *"
  workflow_dispatch:
  pull_request:
    paths:
      - Cargo.toml
      - .github/workflows/install.yml

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

defaults:
  run:
    shell: bash -euxo pipefail {0}

env:
  CARGO_TERM_COLOR: always

jobs:
  published:
    name: Latest release from crates.io, unlocked
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99.1"

      - name: Install without --locked
        run: cargo install rust-doctor --root "$RUNNER_TEMP/published"

      - name: Run
        run: |
          "$RUNNER_TEMP/published/bin/rust-doctor" --version

  head:
    name: This commit, unlocked
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CARGO_RESOLVER_INCOMPATIBLE_RUST_VERSIONS: allow
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99.1"

      - name: Install without --locked
        run: cargo install --path . --root "$RUNNER_TEMP/head"

      - name: Run
        run: |
          "$RUNNER_TEMP/head/bin/rust-doctor" --version
