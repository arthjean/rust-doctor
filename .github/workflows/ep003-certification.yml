name: EP-003 Certification

on:
  push:
    branches: [master, main]
  pull_request:

permissions:
  actions: read
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  corpus:
    name: corpus
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: '1.97'
          components: clippy
      - name: Install sandbox runtime
        run: |
          sudo apt-get update
          sudo apt-get install --yes bubblewrap
          if sysctl -n kernel.apparmor_restrict_unprivileged_userns >/dev/null 2>&1; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          if sysctl -n kernel.unprivileged_userns_clone >/dev/null 2>&1; then
            sudo sysctl -w kernel.unprivileged_userns_clone=1
          fi
      - name: Build evaluation binaries
        shell: bash
        run: |
          set -euo pipefail
          cargo build --release --bin rust-doctor --bin rust-doctor-eval
          test_binary=$(cargo test --no-run --bin rust-doctor-eval --message-format=json |
            jq -r 'select(.reason == "compiler-artifact" and .profile.test and .executable != null) | .executable' |
            tail -n 1)
          test -n "$test_binary"
          echo "TEST_BINARY=$test_binary" >> "$GITHUB_ENV"
      - name: Prove malicious fixture and interruption cleanup
        shell: bash
        run: |
          set -euo pipefail
          scripts/evaluation/run-in-delegated-cgroup.sh \
            env HOME="$HOME" CARGO_HOME="$CARGO_HOME" RUSTUP_HOME="$HOME/.rustup" \
            RUSTUP_TOOLCHAIN=1.97 PATH="$PATH" RUST_DOCTOR_REQUIRE_SANDBOX_TESTS=1 \
            "$TEST_BINARY" --exact \
            evaluation::sandbox::tests::malicious_build_script_cannot_write_outside_sandbox \
            --nocapture
          scripts/evaluation/run-in-delegated-cgroup.sh \
            env HOME="$HOME" CARGO_HOME="$CARGO_HOME" RUSTUP_HOME="$HOME/.rustup" \
            RUSTUP_TOOLCHAIN=1.97 PATH="$PATH" RUST_DOCTOR_REQUIRE_SANDBOX_TESTS=1 \
            "$TEST_BINARY" --exact \
            evaluation::process::tests::cleanup_monitor_removes_cgroup_after_abrupt_parent_exit \
            --nocapture
          scripts/evaluation/run-in-delegated-cgroup.sh \
            env HOME="$HOME" CARGO_HOME="$CARGO_HOME" RUSTUP_HOME="$HOME/.rustup" \
            RUSTUP_TOOLCHAIN=1.97 PATH="$PATH" \
            "$TEST_BINARY" --exact \
            evaluation::process::tests::oversized_output_is_terminated_and_reported \
            --nocapture
      - name: Prepare pinned public corpus
        run: |
          target/release/rust-doctor-eval prepare \
            --manifest evaluation/corpus-v1.json \
            --checkout-root "$RUNNER_TEMP/ep003-corpus" \
            --prepared-out "$RUNNER_TEMP/ep003-prepared.json"
      - name: Execute offline candidate corpus
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          cp "$RUNNER_TEMP/ep003-prepared.json" evidence/prepared.json
          set +e
          scripts/evaluation/run-in-delegated-cgroup.sh \
            env HOME="$HOME" CARGO_HOME="$CARGO_HOME" RUSTUP_HOME="$HOME/.rustup" \
            RUSTUP_TOOLCHAIN=1.97 PATH="$PATH" \
            target/release/rust-doctor-eval corpus \
            --manifest evaluation/corpus-v1.json \
            --prepared "$RUNNER_TEMP/ep003-prepared.json" \
            --checkout-root "$RUNNER_TEMP/ep003-corpus" \
            --binary "$GITHUB_WORKSPACE/target/release/rust-doctor" \
            --tool-revision "$GITHUB_SHA" \
            --output-limit-mib 256 \
            --output "$GITHUB_WORKSPACE/evidence/corpus-candidate.ndjson"
          corpus_status=$?
          set -e
          test "$corpus_status" -eq 0 || test "$corpus_status" -eq 3
          test "$(wc -l < evidence/corpus-candidate.ndjson)" -eq 100
          test "$(jq -s 'map(.expected_roots | length) | add' evidence/corpus-candidate.ndjson)" -ge 250
          test "$(jq -s 'all(.[]; (.expected_roots == .attempted_roots) and (.attempted_roots == .reported_roots))' evidence/corpus-candidate.ndjson)" = true
          test "$(jq -s 'all(.[]; .complete or (.attempts == 3 and (.failure_chain | length) > 0 and all(.failure_chain[]; .kind == "incomplete_report") and ([.failure_chain[].attempt] | unique) == [1,2,3] and all(.root_states[]; . == "complete" or . == "incomplete")))' evidence/corpus-candidate.ndjson)" = true
          if jq -s -e 'all(.[]; .complete)' evidence/corpus-candidate.ndjson >/dev/null; then
            test "$corpus_status" -eq 0
          else
            test "$corpus_status" -eq 3
          fi
          test -z "$(sudo find /sys/fs/cgroup -name 'rust-doctor-*' -print -quit)"
      - name: Prove bounded retries and budgets fail closed
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r checkout; do
            touch "$RUNNER_TEMP/ep003-corpus/$checkout/.rust-doctor-retry-probe"
          done < <(jq -r '.repositories[].checkout_dir' "$RUNNER_TEMP/ep003-prepared.json")
          cleanup() {
            while IFS= read -r checkout; do
              rm -f "$RUNNER_TEMP/ep003-corpus/$checkout/.rust-doctor-retry-probe"
            done < <(jq -r '.repositories[].checkout_dir' "$RUNNER_TEMP/ep003-prepared.json")
          }
          trap cleanup EXIT
          set +e
          scripts/evaluation/run-in-delegated-cgroup.sh \
            env HOME="$HOME" CARGO_HOME="$CARGO_HOME" RUSTUP_HOME="$HOME/.rustup" \
            RUSTUP_TOOLCHAIN=1.97 PATH="$PATH" \
            target/release/rust-doctor-eval corpus \
            --manifest evaluation/corpus-v1.json \
            --prepared "$RUNNER_TEMP/ep003-prepared.json" \
            --checkout-root "$RUNNER_TEMP/ep003-corpus" \
            --binary "$GITHUB_WORKSPACE/target/release/rust-doctor" \
            --tool-revision "$GITHUB_SHA" \
            --output "$GITHUB_WORKSPACE/evidence/retry-failure.ndjson"
          retry_status=$?
          set -e
          test "$retry_status" -ne 0
          test "$(jq -s 'all(.[]; (.complete | not) and .attempts == 3 and ([.failure_chain[].attempt] | unique) == [1,2,3])' evidence/retry-failure.ndjson)" = true
          cleanup
          trap - EXIT
          set +e
          scripts/evaluation/run-in-delegated-cgroup.sh \
            env HOME="$HOME" CARGO_HOME="$CARGO_HOME" RUSTUP_HOME="$HOME/.rustup" \
            RUSTUP_TOOLCHAIN=1.97 PATH="$PATH" \
            target/release/rust-doctor-eval corpus \
            --manifest evaluation/corpus-v1.json \
            --prepared "$RUNNER_TEMP/ep003-prepared.json" \
            --checkout-root "$RUNNER_TEMP/ep003-corpus" \
            --binary "$GITHUB_WORKSPACE/target/release/rust-doctor" \
            --tool-revision "$GITHUB_SHA" \
            --global-timeout-secs 1 \
            --output "$GITHUB_WORKSPACE/evidence/budget-failure.ndjson"
          budget_status=$?
          set -e
          test "$budget_status" -ne 0
          test "$(jq -s 'any(.[]; any(.failure_chain[]; .kind == "global_budget" or .kind == "repository_budget"))' evidence/budget-failure.ndjson)" = true
          test -z "$(sudo find /sys/fs/cgroup -name 'rust-doctor-*' -print -quit)"
      - name: Upload candidate corpus
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ep003-corpus-candidate
          path: evidence/
          if-no-files-found: error
          retention-days: 30

  delta:
    name: delta
    needs: corpus
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: '1.97'
      - name: Read approved corpus identity
        id: approval
        shell: bash
        run: |
          set -euo pipefail
          approval=evaluation/approvals/corpus-baseline.json
          echo "run-id=$(jq -r '.run_id' "$approval")" >> "$GITHUB_OUTPUT"
          echo "artifact-name=$(jq -r '.artifact_name' "$approval")" >> "$GITHUB_OUTPUT"
      - name: Download approved corpus baseline
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: ${{ steps.approval.outputs.artifact-name }}
          path: approved
          repository: ${{ github.repository }}
          run-id: ${{ steps.approval.outputs.run-id }}
          github-token: ${{ github.token }}
          digest-mismatch: error
      - name: Download current corpus candidate
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: ep003-corpus-candidate
          path: candidate
          digest-mismatch: error
      - name: Verify protected baseline artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          scripts/evaluation/verify-approved-artifact.sh \
            evaluation/approvals/corpus-baseline.json \
            approved/corpus-baseline.ndjson \
            ep003-corpus-baseline \
            .github/workflows/ep003-baseline.yml
      - name: Build and execute diagnostic gate
        run: |
          mkdir -p evidence
          cargo build --release --bin rust-doctor-eval
          target/release/rust-doctor-eval delta \
            --baseline approved/corpus-baseline.ndjson \
            --baseline-approval evaluation/approvals/corpus-baseline.json \
            --candidate candidate/corpus-candidate.ndjson \
            --output evidence/delta.json
      - name: Upload diagnostic gate evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ep003-delta
          path: evidence/delta.json
          if-no-files-found: error
          retention-days: 30

  performance:
    name: performance
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      RUST_DOCTOR_BENCHMARK_HOST_CLASS: github-ubuntu-24.04-x64
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: '1.97'
          components: clippy
      - name: Read approved performance identity
        id: approval
        shell: bash
        run: |
          set -euo pipefail
          approval=evaluation/approvals/performance-baseline.json
          echo "run-id=$(jq -r '.run_id' "$approval")" >> "$GITHUB_OUTPUT"
          echo "artifact-name=$(jq -r '.artifact_name' "$approval")" >> "$GITHUB_OUTPUT"
      - name: Download approved performance baseline
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: ${{ steps.approval.outputs.artifact-name }}
          path: approved
          repository: ${{ github.repository }}
          run-id: ${{ steps.approval.outputs.run-id }}
          github-token: ${{ github.token }}
          digest-mismatch: error
      - name: Verify protected baseline artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          scripts/evaluation/verify-approved-artifact.sh \
            evaluation/approvals/performance-baseline.json \
            approved/benchmark-baseline.json \
            ep003-performance-baseline \
            .github/workflows/ep003-baseline.yml
      - name: Execute performance gate
        run: |
          mkdir -p evidence
          cargo build --release --bin rust-doctor --bin rust-doctor-eval
          target/release/rust-doctor-eval benchmark \
            --manifest evaluation/benchmarks-v1.json \
            --binary target/release/rust-doctor \
            --baseline approved/benchmark-baseline.json \
            --baseline-approval evaluation/approvals/performance-baseline.json \
            --output evidence/benchmark-candidate.json \
            --repetitions 3
      - name: Upload performance gate evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ep003-performance
          path: evidence/benchmark-candidate.json
          if-no-files-found: error
          retention-days: 30

  artifacts:
    name: artifacts ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            platform: linux-x64
            archive: tar.gz
            binary: rust-doctor
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
            platform: linux-arm64
            archive: tar.gz
            binary: rust-doctor
          - target: x86_64-apple-darwin
            os: macos-15-intel
            platform: darwin-x64
            archive: tar.gz
            binary: rust-doctor
          - target: aarch64-apple-darwin
            os: macos-14
            platform: darwin-arm64
            archive: tar.gz
            binary: rust-doctor
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            platform: win32-x64
            archive: zip
            binary: rust-doctor.exe
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: '1.97'
          targets: ${{ matrix.target }}
          components: clippy
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest
      - name: Build final package inputs
        shell: bash
        run: |
          cargo build --release --features lsp --target "${{ matrix.target }}" --bin rust-doctor --bin rust-doctor-eval
          cargo build --release --no-default-features --target "${{ matrix.target }}" --target-dir target/no-default --bin rust-doctor
          cargo package --locked
          mkdir -p artifacts
          bash scripts/release/package-native.sh \
            "target/${{ matrix.target }}/release/${{ matrix.binary }}" \
            "${{ matrix.target }}" \
            "${{ matrix.archive }}" \
            artifacts
          bun scripts/release/packages.ts pack \
            "${{ matrix.platform }}" \
            "target/${{ matrix.target }}/release/${{ matrix.binary }}" \
            artifacts
      - name: Exercise exact final package contents
        shell: bash
        run: |
          version=$(cargo metadata --no-deps --format-version=1 | jq -r '.packages[0].version')
          crate_package=$(find target/package -maxdepth 1 -name 'rust-doctor-*.crate' -print -quit)
          test -n "$crate_package"
          target/${{ matrix.target }}/release/rust-doctor-eval smoke \
            --binary target/${{ matrix.target }}/release/${{ matrix.binary }} \
            --no-default-binary target/no-default/${{ matrix.target }}/release/${{ matrix.binary }} \
            --schema schemas/report-v1.schema.json \
            --npm-platform-package "artifacts/rust-doctor-npm-${{ matrix.platform }}-${version}.tgz" \
            --npm-wrapper-package "artifacts/rust-doctor-npm-${version}.tgz" \
            --bun "$(command -v bun)" \
            --archive "artifacts/rust-doctor-${{ matrix.target }}.${{ matrix.archive }}" \
            --crate-package "$crate_package"
          cp "$crate_package" artifacts/
      - name: Upload final package evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ep003-artifacts-${{ matrix.target }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 30
