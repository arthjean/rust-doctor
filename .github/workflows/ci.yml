name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

defaults:
  run:
    shell: bash -euxo pipefail {0}

env:
  CARGO_TERM_COLOR: always

jobs:
  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99.1"
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: "v1-rust"
          key: clippy

      - name: Clippy
        run: cargo clippy --all-targets --no-deps --locked -- -D warnings

  docs:
    name: Documentation gates
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Verify documentation budgets
        run: bash scripts/verify-doc-budgets.sh

      - name: Verify documentation references
        run: bash scripts/verify-doc-refs.sh

  test:
    name: Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      RUST_DOCTOR_BENCHMARK_ALLOWANCE: "3"
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99.1"
          components: clippy
          targets: x86_64-pc-windows-msvc

      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: "v1-rust"
          key: test-${{ matrix.os }}

      - name: Test
        run: cargo test --locked

  msrv:
    name: MSRV 1.95
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.95"

      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: "v1-rust"
          key: msrv

      - name: Check
        run: cargo check --locked --all-targets

  windows:
    name: Build (windows)
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99.1"

      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: "v1-rust"
          key: build-windows

      - name: Check
        run: cargo check --locked --all-targets

  launcher:
    name: Node launcher
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@v1
        with:
          bun-version: 1.3.14

      - name: Test the launcher
        working-directory: npm/rust-doctor
        run: bun test tests

  packed:
    name: Packed launcher smoke
    needs: build-release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: actions/download-artifact@v4
        with:
          name: rust-doctor-release
          path: ${{ runner.temp }}/rust-doctor-release

      - name: Make the binary executable
        run: chmod +x "$RUNNER_TEMP/rust-doctor-release/rust-doctor"

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99.1"
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: "v1-rust"
          key: packed

      - name: Fetch this repository's dependencies
        run: cargo fetch --locked

      - uses: oven-sh/setup-bun@v1
        with:
          bun-version: 1.3.14

      - uses: actions/setup-node@v4
        with:
          node-version: "22.13.0"

      - name: Packed launcher smoke
        working-directory: npm/rust-doctor
        env:
          RUST_DOCTOR_BINARY: ${{ runner.temp }}/rust-doctor-release/rust-doctor
        run: bun run smoke:packed

  build-release:
    name: Release build
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99.1"

      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: "v1-rust"
          key: release

      - name: Build
        run: cargo build --release --locked

      - uses: actions/upload-artifact@v4
        with:
          name: rust-doctor-release
          path: target/release/rust-doctor
          if-no-files-found: error
          retention-days: 3

  e2e-shard:
    name: E2E (shard ${{ matrix.shard }})
    needs: build-release
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4]
    env:
      RUST_DOCTOR_E2E_BIN: ${{ github.workspace }}/target/release/rust-doctor
      E2E_REQUIRE_TMUX: "1"
      E2E_REQUIRE_NETNS: "1"
      RUST_DOCTOR_BENCHMARK_ALLOWANCE: "3"
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          name: rust-doctor-release
          path: target/release

      - name: Make the binary executable
        run: chmod +x target/release/rust-doctor

      - name: Install tmux and strace
        run: sudo apt-get update && sudo apt-get install -y tmux strace

      - name: Allow unprivileged user namespaces
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99.1"
          components: clippy

      - name: Fetch this repository's dependencies
        run: cargo fetch --locked

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: tests/e2e/package.json

      - uses: actions/setup-node@v4
        with:
          node-version: "22.13.0"

      - name: Install the suite
        working-directory: tests/e2e
        run: bun install --frozen-lockfile

      - name: Plan the shard
        id: plan
        working-directory: tests/e2e
        run: |
          files="$(bun ci-shards.ts --shard-count 5 --shard-index ${{ matrix.shard }})"
          {
            echo "files<<EOF"
            echo "$files"
            echo "EOF"
            echo "key=$(printf '%s\n' "$files" | sha256sum | cut -c1-16)"
          } >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/rust-doctor-e2e/targets
          key: e2e-targets-1.99.1-${{ hashFiles('Cargo.lock') }}-${{ steps.plan.outputs.key }}

      - name: Typecheck
        working-directory: tests/e2e
        run: bun run typecheck

      - name: Run the shard
        working-directory: tests/e2e
        env:
          RUST_DOCTOR_E2E_ROOT: ${{ runner.temp }}/rust-doctor-e2e
          FILES: ${{ steps.plan.outputs.files }}
        run: |
          mapfile -t files <<< "$FILES"
          bash ci-run-files.sh "${files[@]}"

  e2e:
    name: e2e
    needs: e2e-shard
    if: always()
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - name: Require every shard
        run: test "${{ needs.e2e-shard.result }}" = success
