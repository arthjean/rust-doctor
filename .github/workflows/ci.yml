name: CI

on:
  push:
    branches: [master, main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Check & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: stable
          components: clippy, rustfmt

      - name: Check
        run: cargo check

      - name: Clippy (pedantic + nursery)
        run: cargo clippy --all-targets -- -W clippy::all -W clippy::pedantic -W clippy::nursery -D warnings

      - name: Format
        run: cargo fmt --check

      - name: Test
        run: cargo test

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: Security audit
        run: cargo audit

      - name: Install cargo-deny
        run: cargo install cargo-deny --locked

      - name: Supply-chain check (cargo-deny)
        run: cargo deny check

      - name: Publish dry-run
        run: cargo publish --dry-run

  artifact-smoke:
    name: Built artifact smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: stable
          components: clippy

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest

      - name: Build release surfaces
        run: |
          cargo build --release --bin rust-doctor --bin rust-doctor-eval
          cargo build --release --no-default-features --bin rust-doctor --target-dir target/no-default
          cargo package --locked
          mkdir -p artifacts
          bash scripts/release/package-native.sh \
            target/release/rust-doctor \
            x86_64-unknown-linux-gnu \
            tar.gz \
            artifacts
          bun scripts/release/packages.ts pack \
            linux-x64 \
            target/release/rust-doctor \
            artifacts

      - name: Exercise built and final packaged surfaces
        run: |
          version=$(cargo metadata --no-deps --format-version=1 | jq -r '.packages[0].version')
          crate_package=$(find target/package -maxdepth 1 -name 'rust-doctor-*.crate' -print -quit)
          test -n "$crate_package"
          target/release/rust-doctor-eval smoke \
            --binary target/release/rust-doctor \
            --no-default-binary target/no-default/release/rust-doctor \
            --schema schemas/report-v1.schema.json \
            --npm-platform-package "artifacts/rust-doctor-npm-linux-x64-${version}.tgz" \
            --npm-wrapper-package "artifacts/rust-doctor-npm-${version}.tgz" \
            --bun "$(command -v bun)" \
            --archive artifacts/rust-doctor-x86_64-unknown-linux-gnu.tar.gz \
            --crate-package "$crate_package"

  editor-adapters:
    name: Packaged editor adapters
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: stable

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest

      - name: Build the real language server
        run: cargo build --features lsp --bin rust-doctor

      - name: Build, test, package, and exercise VS Code/Cursor adapter
        working-directory: editors/vscode
        env:
          RUST_DOCTOR_LSP_BINARY: ${{ github.workspace }}/target/debug/rust-doctor
        run: |
          bun install --frozen-lockfile
          bun run package

      - name: Build, test, package, and exercise Zed adapter
        working-directory: editors/zed
        env:
          RUST_DOCTOR_LSP_BINARY: ${{ github.workspace }}/target/debug/rust-doctor
        run: bun run package

  public-website:
    name: Public website contract
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Check out Rust Doctor
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: rust-doctor
          persist-credentials: false

      - name: Check out the independent website
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: arthjean/rust-doctor-web
          ref: 8190d3eac96294c27b950b0a338922db1d894129
          path: rust-doctor-web
          persist-credentials: false

      - name: Resolve candidate source identity
        id: rust-doctor-source
        run: echo "sha=$(git -C rust-doctor rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Install Rust 1.97
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: "1.97"

      - name: Install Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14

      - name: Build the candidate binary
        working-directory: rust-doctor
        run: cargo build --locked --bin rust-doctor

      - name: Install website dependencies and Chromium
        working-directory: rust-doctor-web
        run: |
          bun install --frozen-lockfile
          bunx playwright install --with-deps chromium

      - name: Verify the external public contract
        working-directory: rust-doctor-web
        env:
          RUST_DOCTOR_BIN: ${{ github.workspace }}/rust-doctor/target/debug/rust-doctor
          RUST_DOCTOR_SOURCE_DIR: ${{ github.workspace }}/rust-doctor
          RUST_DOCTOR_SOURCE_REF: ${{ steps.rust-doctor-source.outputs.sha }}
          RUST_DOCTOR_SOURCE_SHA: ${{ steps.rust-doctor-source.outputs.sha }}
          WCAG_AUDIT_PATH: ${{ runner.temp }}/rust-doctor-wcag-audit.json
        run: |
          bun run catalog:check-only
          bun run catalog:sync
          bun run build:verified
          bun run audit:wcag

      - name: Upload public-contract evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: rust-doctor-public-contract
          path: |
            rust-doctor-web/public/catalog/build-provenance.json
            ${{ runner.temp }}/rust-doctor-wcag-audit.json
          if-no-files-found: error

  release-verification:
    name: Five-platform release verification
    uses: ./.github/workflows/release-verify.yml
