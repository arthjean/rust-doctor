name: Publish Any Commit

# Build an installable Linux candidate for every pushed commit and PR. Rust
# crates and native binaries have no safe equivalent to pkg-pr-new, so the
# preview is a short-lived GitHub artifact rather than a registry publication.

on: [push, pull_request]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Package Linux candidate
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: "1.97"

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14

      - name: Build candidate
        run: |
          cargo build --locked --release --bin rust-doctor
          cargo package --locked
          mkdir -p artifacts
          bash scripts/release/package-native.sh \
            target/release/rust-doctor \
            x86_64-unknown-linux-gnu \
            tar.gz \
            artifacts
          bun scripts/release/packages.ts pack \
            linux-x64 \
            target/release/rust-doctor \
            artifacts
          cp target/package/rust-doctor-*.crate artifacts/

      - name: Upload candidate
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: rust-doctor-candidate-${{ github.run_id }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 7
