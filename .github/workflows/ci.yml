name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test (${{ matrix.os }}, Rust ${{ matrix.toolchain }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            toolchain: "1.97"
          - os: ubuntu-latest
            toolchain: stable
          - os: macos-latest
            toolchain: stable
          - os: windows-latest
            toolchain: stable
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: ${{ matrix.toolchain }}

      - name: Test all features
        run: cargo test --locked --all-features

      - name: Test without default features
        if: ${{ matrix.os == 'ubuntu-latest' && matrix.toolchain == 'stable' }}
        run: cargo test --locked --no-default-features

  artifact-smoke:
    name: Built artifact smoke
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: "1.97"

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14

      - name: Build release surfaces
        run: |
          cargo build --locked --release --features lsp --bin rust-doctor --bin rust-doctor-eval
          cargo build --locked --release --no-default-features --bin rust-doctor --target-dir target/no-default
          cargo package --locked
          mkdir -p artifacts
          bash scripts/release/package-native.sh \
            target/release/rust-doctor \
            x86_64-unknown-linux-gnu \
            tar.gz \
            artifacts
          bun scripts/release/packages.ts pack \
            linux-x64 \
            target/release/rust-doctor \
            artifacts

      - name: Exercise built and packaged surfaces
        run: |
          version="$(cargo metadata --no-deps --format-version=1 | jq -r '.packages[0].version')"
          crate_package="$(find target/package -maxdepth 1 -name 'rust-doctor-*.crate' -print -quit)"
          test -n "$crate_package"
          target/release/rust-doctor-eval smoke \
            --binary target/release/rust-doctor \
            --no-default-binary target/no-default/release/rust-doctor \
            --lsp-binary target/release/rust-doctor \
            --schema schemas/report-v1.schema.json \
            --npm-platform-package "artifacts/rust-doctor-npm-linux-x64-${version}.tgz" \
            --npm-wrapper-package "artifacts/rust-doctor-npm-${version}.tgz" \
            --bun "$(command -v bun)" \
            --archive artifacts/rust-doctor-x86_64-unknown-linux-gnu.tar.gz \
            --crate-package "$crate_package" \
            --action action.yml

  editor-adapters:
    name: Packaged editor adapters
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: "1.97"

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14

      - name: Build language server
        run: cargo build --locked --features lsp --bin rust-doctor

      - name: Package VS Code and Cursor adapter
        working-directory: editors/vscode
        env:
          RUST_DOCTOR_LSP_BINARY: ${{ github.workspace }}/target/debug/rust-doctor
        run: |
          bun install --frozen-lockfile
          bun run package

      - name: Package Zed adapter
        working-directory: editors/zed
        env:
          RUST_DOCTOR_LSP_BINARY: ${{ github.workspace }}/target/debug/rust-doctor
        run: bun run package

  public-website:
    name: Public website contract
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: ep006-public-contract
    permissions:
      contents: read
    steps:
      - name: Check out Rust Doctor
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          path: rust-doctor
          persist-credentials: false

      - name: Check out independent website
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          repository: arthjean/rust-doctor-web
          ref: f4db958fcb1fadc9d61c253558c373065e855a11
          path: rust-doctor-web
          ssh-key: ${{ secrets.RUST_DOCTOR_WEB_DEPLOY_KEY }}
          persist-credentials: false

      - name: Resolve candidate source identity
        id: rust-doctor-source
        run: echo "sha=$(git -C rust-doctor rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: "1.97"

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14

      - name: Build candidate binary
        working-directory: rust-doctor
        run: cargo build --locked --bin rust-doctor

      - name: Install website dependencies and Chromium
        working-directory: rust-doctor-web
        run: |
          bun install --frozen-lockfile
          bunx playwright install --with-deps chromium

      - name: Verify external public contract
        working-directory: rust-doctor-web
        env:
          RUST_DOCTOR_BIN: ${{ github.workspace }}/rust-doctor/target/debug/rust-doctor
          RUST_DOCTOR_SOURCE_DIR: ${{ github.workspace }}/rust-doctor
          RUST_DOCTOR_SOURCE_REF: ${{ steps.rust-doctor-source.outputs.sha }}
          RUST_DOCTOR_SOURCE_SHA: ${{ steps.rust-doctor-source.outputs.sha }}
          WCAG_AUDIT_PATH: ${{ runner.temp }}/rust-doctor-wcag-audit.json
        run: |
          bun run catalog:check-only
          bun run catalog:sync
          bun run build:verified
          bun run audit:wcag

      - name: Upload public-contract evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: rust-doctor-public-contract
          path: |
            rust-doctor-web/public/catalog/build-provenance.json
            ${{ runner.temp }}/rust-doctor-wcag-audit.json
          if-no-files-found: error
