name: rust-doctor
description: Scan a Rust workspace with rust-doctor, publish its score and delta as outputs and a job summary, and upload the report.
author: Arthur Jean
branding:
  icon: activity
  color: orange

# Every input reaches the shell through `env`, never through `${{ }}` inside a
# run block: a branch name or an argument is text the caller may not control,
# and interpolating it into a script is a command injection. rust-doctor
# itself reaches no network; the npm install, the base fetch, the artifact
# upload and the pull request comment are the runner's, the last with the
# workflow's own token. Every action used here is pinned to a commit, with the
# ref it was read from beside it.

inputs:
  version:
    description: The rust-doctor version to install through the npm launcher, or `preinstalled` to run the rust-doctor already on PATH.
    required: false
    default: "0.7.0"
  toolchain:
    description: The Rust toolchain to install with Clippy. Defaults to the one this release was validated on.
    required: false
    default: "1.97.1"
  scope:
    description: full, files, lines or baseline. Empty scans a pull request in baseline scope against its base, and anything else in full scope.
    required: false
    default: ""
  base:
    description: "The ref a files, lines or baseline scope compares against. Empty takes the pull request's base, or the default branch the repository answers for. These scopes need the base's history: check out with `fetch-depth: 0`. On a pull request from a shallow checkout, the Action fetches the base itself when the token allows it."
    required: false
    default: ""
  blocking:
    description: none, error or warning. Empty lets the workspace's rust-doctor.toml decide.
    required: false
    default: ""
  warning-exit-code:
    description: "An exit code from 3 to 125 for a scan whose gate passed but that holds a finding `--blocking warning` would block. Like a gate failure, it fails only a pull request. Empty keeps such a scan at 0."
    required: false
    default: ""
  working-directory:
    description: The workspace to scan.
    required: false
    default: "."
  args:
    description: Further rust-doctor arguments, split on whitespace.
    required: false
    default: ""
  comment:
    description: "On a pull request, post the summary as one sticky comment, edited on each push. Needs `pull-requests: write`; a pull request from a fork gets a read-only token, and a warning instead."
    required: false
    default: "true"
  comment-on-clean:
    description: "Post the comment on a clean pull request too: a complete scan with no introduced finding in baseline scope, or no finding otherwise. With `false`, a clean pull request gets no new comment, and an existing one is still updated."
    required: false
    default: "true"
  cache:
    description: "Restore and save Cargo's build with Swatinem/rust-cache, saving it even when the gate fails the job, so the retry is warm."
    required: false
    default: "true"

outputs:
  score:
    description: The score out of 100, empty when none was computed.
    value: ${{ steps.outputs.outputs.score }}
  authoritative:
    description: Whether the score is authoritative, true or false.
    value: ${{ steps.outputs.outputs.authoritative }}
  introduced:
    description: Findings the change introduced, in baseline scope. Empty otherwise.
    value: ${{ steps.outputs.outputs.introduced }}
  fixed:
    description: Findings the change fixed, in baseline scope. Empty otherwise.
    value: ${{ steps.outputs.outputs.fixed }}
  exit-code:
    description: The scan's exit code, 0 passed, 1 gate failed or incomplete, 2 failed.
    value: ${{ steps.scan.outputs.exit-code }}

runs:
  using: composite
  steps:
    - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master
      with:
        toolchain: ${{ inputs.toolchain }}
        components: clippy

    # The post-job save is skipped when a failed gate fails the job, unless
    # rust-cache is told to save on failure.
    - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      if: inputs.cache == 'true'
      with:
        workspaces: ${{ inputs.working-directory }}
        cache-on-failure: true

    - name: Install rust-doctor
      if: inputs.version != 'preinstalled'
      shell: bash
      env:
        VERSION: ${{ inputs.version }}
      run: npm install -g "rust-doctor@$VERSION"

    # The scan's exit code is kept rather than raised here, so the summary,
    # the artifact and the outputs exist for a failed scan too. GitHub runs
    # `shell: bash` with `-e`, so a status is only ever read through `||`.
    - name: Scan
      id: scan
      shell: bash
      env:
        SCOPE: ${{ inputs.scope }}
        BASE: ${{ inputs.base }}
        BLOCKING: ${{ inputs.blocking }}
        WARNING_EXIT_CODE: ${{ inputs.warning-exit-code }}
        ARGS: ${{ inputs.args }}
        WORKSPACE: ${{ inputs.working-directory }}
        PULL_REQUEST_BASE: ${{ github.base_ref }}
      run: |
        set -uo pipefail
        report="$RUNNER_TEMP/rust-doctor/report.json"
        mkdir -p "$(dirname "$report")"
        echo "report=$report" >> "$GITHUB_OUTPUT"
        scope="$SCOPE"
        base="$BASE"
        if [ -z "$scope" ]; then
          if [ -n "${PULL_REQUEST_BASE:-}" ]; then scope=baseline; else scope=full; fi
        fi
        if [ -z "$base" ] && [ "$scope" != full ] && [ -n "${PULL_REQUEST_BASE:-}" ]; then
          base="origin/$PULL_REQUEST_BASE"
        fi
        # A depth-1 checkout holds neither the base nor any ancestor. Fetch
        # them once, best effort: when it fails, the scan says `shallow-clone`
        # and names the remedy.
        if [ "$scope" != full ] && [ -n "${PULL_REQUEST_BASE:-}" ] \
          && [ "$(git -C "$WORKSPACE" rev-parse --is-shallow-repository 2>/dev/null)" = true ]; then
          git -C "$WORKSPACE" fetch --no-tags --unshallow origin \
            "+refs/heads/$PULL_REQUEST_BASE:refs/remotes/origin/$PULL_REQUEST_BASE" || true
        fi
        arguments=("$WORKSPACE" --yes --json --scope "$scope")
        if [ -n "$base" ]; then arguments+=(--base "$base"); fi
        if [ -n "$BLOCKING" ]; then arguments+=(--blocking "$BLOCKING"); fi
        if [ -n "${WARNING_EXIT_CODE:-}" ]; then arguments+=(--warning-exit-code "$WARNING_EXIT_CODE"); fi
        if [ -n "$ARGS" ]; then
          read -r -a extra <<< "$ARGS"
          arguments+=("${extra[@]}")
        fi
        status=0
        rust-doctor "${arguments[@]}" > "$report" || status=$?
        echo "exit-code=$status" >> "$GITHUB_OUTPUT"

    # Rendered once, for the job summary and the pull request comment, on
    # every event. `clean` is a boolean jq computes, never text of the report.
    - name: Summarize
      id: summarize
      if: always()
      shell: bash
      env:
        REPORT: ${{ steps.scan.outputs.report }}
      run: |
        summary="$RUNNER_TEMP/rust-doctor/summary.md"
        mkdir -p "$(dirname "$summary")"
        if rust-doctor report markdown "$REPORT" > "$summary"; then
          cat "$summary" >> "$GITHUB_STEP_SUMMARY"
        else
          : > "$summary"
          echo "rust-doctor wrote no report that could be rendered." >> "$GITHUB_STEP_SUMMARY"
        fi
        clean=$(jq -r '.status == "complete" and (if .scope.mode == "baseline" then .delta.summary.introduced == 0 else (.diagnostics | length) == 0 end)' "$REPORT" 2>/dev/null) || clean=false
        if [ "$clean" != true ]; then clean=false; fi
        echo "clean=$clean" >> "$GITHUB_OUTPUT"

    - name: Upload the report
      if: always()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
      with:
        name: rust-doctor-report
        path: ${{ steps.scan.outputs.report }}
        if-no-files-found: ignore
        retention-days: 7

    - name: Comment on the pull request
      if: always() && github.event_name == 'pull_request' && inputs.comment == 'true'
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        REPOSITORY: ${{ github.repository }}
        PULL_REQUEST: ${{ github.event.pull_request.number }}
        CLEAN: ${{ steps.summarize.outputs.clean }}
        COMMENT_ON_CLEAN: ${{ inputs.comment-on-clean }}
      run: |
        set -euo pipefail
        summary="$RUNNER_TEMP/rust-doctor/summary.md"
        if [ ! -s "$summary" ]; then
          echo "::notice::rust-doctor wrote no report, so no comment was posted."
          exit 0
        fi
        body="$(printf '<!-- rust-doctor -->\n\n'; cat "$summary")"
        if ! comments=$(gh api --paginate "repos/$REPOSITORY/issues/$PULL_REQUEST/comments"); then
          echo "::warning::rust-doctor could not read the pull request's comments, so none was posted."
          exit 0
        fi
        comment=$(jq -s -r '[.[][] | select(.user.login == "github-actions[bot]" and (.body | startswith("<!-- rust-doctor -->"))) | .id] | first // empty' <<< "$comments")
        if [ -z "$comment" ] && [ "${CLEAN:-false}" = true ] && [ "${COMMENT_ON_CLEAN:-true}" = false ]; then
          echo "::notice::The pull request is clean and comment-on-clean is false, so no comment was posted."
          exit 0
        fi
        if [ -n "$comment" ]; then
          gh api -X PATCH "repos/$REPOSITORY/issues/comments/$comment" -f body="$body" > /dev/null
        else
          gh api -X POST "repos/$REPOSITORY/issues/$PULL_REQUEST/comments" -f body="$body" > /dev/null
        fi || echo "::warning::rust-doctor could not post the pull request comment. A pull request from a fork gets a read-only token."

    # Only numbers and booleans are read out of the report, so nothing it
    # carries can write a second output line.
    - name: Set the outputs
      id: outputs
      if: always()
      shell: bash
      env:
        REPORT: ${{ steps.scan.outputs.report }}
      run: |
        jq -r '
          "score=\(.audit.score.value | numbers // "")",
          "authoritative=\(.audit.score.authoritative | booleans // false)",
          "introduced=\(.delta.summary.introduced | numbers // "")",
          "fixed=\(.delta.summary.fixed | numbers // "")"
        ' "$REPORT" >> "$GITHUB_OUTPUT" || echo "authoritative=false" >> "$GITHUB_OUTPUT"

    # Only a pull request fails on the gate (1) or on the warning code: a push
    # or any other event is a health snapshot that reports without turning the
    # branch red. A scan that could not run (2) fails on every event.
    - name: Exit with the scan's code
      if: always()
      shell: bash
      env:
        EXIT_CODE: ${{ steps.scan.outputs.exit-code }}
        EVENT_NAME: ${{ github.event_name }}
        WARNING_EXIT_CODE: ${{ inputs.warning-exit-code }}
      run: |
        code="${EXIT_CODE:-2}"
        if { [ "$code" = 1 ] || [ "$code" = "${WARNING_EXIT_CODE:-}" ]; } && [ "${EVENT_NAME:-}" != pull_request ]; then
          echo "::notice::The gate failed, and only a pull request fails on it: this ${EVENT_NAME:-run} reports without failing."
          code=0
        fi
        exit "$code"
