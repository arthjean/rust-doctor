name: Corpus

on:
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:
  pull_request:
    paths:
      - tests/corpus.json
      - tests/corpus_precision.rs
      - tests/support/corpus.rs
      - tests/support/corpus/**
      - src/audit.rs
      - src/audit/**
      - src/cargo_health.rs
      - src/cargo_health/**
      - src/execution.rs
      - src/execution/**
      - src/repo_hygiene.rs
      - src/repo_hygiene/**
      - src/source_kernel.rs
      - src/source_kernel/**
      - src/source_text.rs
      - src/structure.rs
      - src/structure/**
      - tests/e2e/corpus-*
      - tests/e2e/real-subject.test.ts
      - .github/workflows/corpus.yml

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

defaults:
  run:
    shell: bash -euxo pipefail {0}

env:
  CARGO_TERM_COLOR: always

jobs:
  clones:
    name: Hold every pinned revision with its history
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    outputs:
      key: ${{ steps.clones.outputs.cache-primary-key }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Restore the clone cache
        id: clones
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/corpus-cache
          key: corpus-clones-v2-${{ hashFiles('tests/corpus.json') }}
          restore-keys: corpus-clones-v2-

      - name: Require the clone cache on a pull request
        if: github.event_name == 'pull_request' && steps.clones.outputs.cache-matched-key == ''
        run: |
          echo "No clone cache matched ${{ steps.clones.outputs.cache-primary-key }},"
          echo "and nothing matched the prefix corpus-clones-v2- either."
          echo "Seed it with a manual run on the base branch, then re-run this job:"
          echo "  gh workflow run corpus.yml"
          exit 1

      - name: Materialize both populations
        run: |
          cache="$RUNNER_TEMP/corpus-cache"
          mkdir -p "$cache"
          jq -r '
            (.manifest.repositories + .agent_population.repositories)[]
            | [.name, .url, .commit] | @tsv
          ' tests/corpus.json | while IFS=$'\t' read -r name url commit; do
            repository="$cache/$name"
            if [ "$(git -C "$repository" rev-parse HEAD 2>/dev/null || true)" = "$commit" ] \
              && [ "$(git -C "$repository" rev-parse --is-shallow-repository)" = false ]; then
              continue
            fi
            rm -rf "$repository"
            git init --quiet "$repository"
            git -C "$repository" remote add origin "$url"
            git -C "$repository" fetch --quiet origin "$commit"
            git -C "$repository" checkout --quiet --detach FETCH_HEAD
          done

      - name: Save the clone cache
        if: steps.clones.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/corpus-cache
          key: ${{ steps.clones.outputs.cache-primary-key }}

  measure:
    name: Reproduce the pinned measurement
    needs: clones
    runs-on: ubuntu-26.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Restore the clone cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/corpus-cache
          key: ${{ needs.clones.outputs.key }}
          fail-on-cache-miss: true

      - name: Resolve the corpus paths
        run: |
          {
            echo "RUST_DOCTOR_CORPUS_DIR=$RUNNER_TEMP/corpus-cache"
            echo "RUST_DOCTOR_CORPUS_ARTIFACTS=$RUNNER_TEMP/corpus-artifacts"
          } >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/corpus-artifacts"
          test "$RUNNER_TEMP/corpus-cache" = "${{ runner.temp }}/corpus-cache"

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99.1"
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: "v1-rust"
          key: corpus

      - name: Reproduce
        run: cargo test --locked --test corpus_precision

      - name: Upload the position proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: corpus-position-proof
          path: ${{ env.RUST_DOCTOR_CORPUS_ARTIFACTS }}/position-proof.json
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload the replayed measurement
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: corpus-measurement
          path: |
            ${{ env.RUST_DOCTOR_CORPUS_ARTIFACTS }}/observations.json
            ${{ env.RUST_DOCTOR_CORPUS_ARTIFACTS }}/agent-replay/agent-observations.json
          if-no-files-found: ignore
          retention-days: 14

  replay:
    name: Replay the corpus end to end
    needs: clones
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Restore the clone cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/corpus-cache
          key: ${{ needs.clones.outputs.key }}
          fail-on-cache-miss: true

      - name: Resolve the corpus paths
        run: |
          {
            echo "RUST_DOCTOR_E2E_CORPUS_DIR=$RUNNER_TEMP/corpus-cache"
            echo "RUST_DOCTOR_E2E_ROOT=$RUNNER_TEMP/rust-doctor-e2e"
            echo "RUST_DOCTOR_E2E_BIN=$GITHUB_WORKSPACE/target/release/rust-doctor"
          } >> "$GITHUB_ENV"
          test "$RUNNER_TEMP/corpus-cache" = "${{ runner.temp }}/corpus-cache"

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99.1"
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: "v1-rust"
          key: e2e-corpus

      - name: Build
        run: cargo build --release --locked

      - name: Warm the registry
        run: |
          jq -r '
            (.manifest.repositories + .agent_population.repositories)[]
            | [.name, .commit] | @tsv
          ' tests/corpus.json | while IFS=$'\t' read -r name commit; do
            copy="$RUNNER_TEMP/fetch/$name"
            mkdir -p "$copy"
            GIT_INDEX_FILE="$RUNNER_TEMP/fetch/$name.index" git -C "$RUST_DOCTOR_E2E_CORPUS_DIR/$name" read-tree "$commit"
            GIT_INDEX_FILE="$RUNNER_TEMP/fetch/$name.index" git -C "$RUST_DOCTOR_E2E_CORPUS_DIR/$name" checkout-index --all --force --prefix="$copy/"
            if [ -f "$copy/Cargo.toml" ]; then
              cargo fetch --manifest-path "$copy/Cargo.toml"
            fi
          done
          rm -rf "$RUNNER_TEMP/fetch"

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: tests/e2e/package.json

      - uses: actions/setup-node@v4
        with:
          node-version: "22.13.0"

      - name: Install the suite
        working-directory: tests/e2e
        run: bun install --frozen-lockfile

      - name: Replay
        working-directory: tests/e2e
        env:
          CARGO_NET_OFFLINE: "true"
        run: bun test ./corpus-replay.test.ts ./real-subject.test.ts
