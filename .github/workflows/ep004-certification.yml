name: EP-004 Release Certification

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 1"

permissions:
  actions: read
  contents: read

concurrency:
  group: ep004-release-certification
  cancel-in-progress: false

jobs:
  certify:
    name: Certify decision quality
    runs-on: ubuntu-24.04
    timeout-minutes: 480
    env:
      RUST_DOCTOR_BENCHMARK_HOST_CLASS: github-ubuntu-24.04-x64
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Select certified source revision
        id: source
        run: |
          revision="$GITHUB_SHA"
          checked=false
          expected="$RUNNER_TEMP/ep004-checked-evidence"
          if [[ -f evaluation/certifications/decision-quality-v1.json ]]; then
            revision=$(jq -r '.release_evidence.tool_revision' \
              evaluation/certifications/decision-quality-v1.json)
            [[ "$revision" =~ ^[0-9a-fA-F]{40}$ ]]
            git cat-file -e "${revision}^{commit}"
            git merge-base --is-ancestor "$revision" "$GITHUB_SHA"
            unexpected=$(
              git diff --name-only "$revision" "$GITHUB_SHA" |
                grep -Ev \
                  '^(evaluation/release-evidence-v1\.json|evaluation/certifications/.*|evaluation/approvals/ep004-certification\.json|tasks/prd-decision-quality-hardening-status\.json|docs/report-v1-migration\.md)$' \
                  || true
            )
            test -z "$unexpected"
            approval=evaluation/approvals/ep004-certification.json
            test -f "$approval"
            mkdir -p "$expected"
            cp evaluation/release-evidence-v1.json "$expected/"
            cp -a evaluation/certifications "$expected/"
            cp "$approval" "$expected/"
            echo "candidate-run=$(jq -r '.run_id' "$approval")" >> "$GITHUB_OUTPUT"
            echo "candidate-name=$(jq -r '.artifact_name' "$approval")" >> "$GITHUB_OUTPUT"
            checked=true
            git checkout --detach "$revision"
          fi
          echo "revision=$revision" >> "$GITHUB_OUTPUT"
          echo "checked=$checked" >> "$GITHUB_OUTPUT"
          echo "expected=$expected" >> "$GITHUB_OUTPUT"

      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: "1.97"
          components: clippy, rustfmt

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14

      - name: Install certification runtimes
        run: |
          sudo apt-get update
          sudo apt-get install --yes bubblewrap
          if sysctl -n kernel.apparmor_restrict_unprivileged_userns >/dev/null 2>&1; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          if sysctl -n kernel.unprivileged_userns_clone >/dev/null 2>&1; then
            sudo sysctl -w kernel.unprivileged_userns_clone=1
          fi
          cargo install cargo-audit --version 0.21.2 --locked
          cargo install cargo-deny --version 0.19.8 --locked
          cargo install cargo-geiger --version 0.12.0 --locked
          cargo install cargo-semver-checks --version 0.42.0 --locked
          cargo install cargo-shear --version 1.6.6 --locked

      - name: Read protected baseline identities
        id: approvals
        run: |
          echo "corpus-run=$(jq -r '.run_id' evaluation/approvals/corpus-baseline.json)" >> "$GITHUB_OUTPUT"
          echo "corpus-name=$(jq -r '.artifact_name' evaluation/approvals/corpus-baseline.json)" >> "$GITHUB_OUTPUT"
          echo "performance-run=$(jq -r '.run_id' evaluation/approvals/performance-baseline.json)" >> "$GITHUB_OUTPUT"
          echo "performance-name=$(jq -r '.artifact_name' evaluation/approvals/performance-baseline.json)" >> "$GITHUB_OUTPUT"

      - name: Download approved corpus baseline
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: ${{ steps.approvals.outputs.corpus-name }}
          path: ${{ runner.temp }}/approved/corpus
          repository: ${{ github.repository }}
          run-id: ${{ steps.approvals.outputs.corpus-run }}
          github-token: ${{ github.token }}
          digest-mismatch: error

      - name: Download approved performance baseline
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: ${{ steps.approvals.outputs.performance-name }}
          path: ${{ runner.temp }}/approved/performance
          repository: ${{ github.repository }}
          run-id: ${{ steps.approvals.outputs.performance-run }}
          github-token: ${{ github.token }}
          digest-mismatch: error

      - name: Download certified source evidence
        if: ${{ steps.source.outputs.checked == 'true' }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: ${{ steps.source.outputs.candidate-name }}
          path: ${{ runner.temp }}/approved/candidate
          repository: ${{ github.repository }}
          run-id: ${{ steps.source.outputs.candidate-run }}
          github-token: ${{ github.token }}
          digest-mismatch: error

      - name: Verify protected baseline artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          scripts/evaluation/verify-approved-artifact.sh \
            evaluation/approvals/corpus-baseline.json \
            "$RUNNER_TEMP/approved/corpus/corpus-baseline.ndjson" \
            ep003-corpus-baseline \
            .github/workflows/ep003-baseline.yml
          scripts/evaluation/verify-approved-artifact.sh \
            evaluation/approvals/performance-baseline.json \
            "$RUNNER_TEMP/approved/performance/benchmark-baseline.json" \
            ep003-performance-baseline \
            .github/workflows/ep003-baseline.yml
          if [[ "${{ steps.source.outputs.checked }}" == true ]]; then
            scripts/evaluation/verify-approved-artifact.sh \
              "${{ steps.source.outputs.expected }}/ep004-certification.json" \
              "$RUNNER_TEMP/approved/candidate/evidence/corpus-candidate.ndjson" \
              ep004-release-certification \
              .github/workflows/ep004-certification.yml
          fi

      - name: Build exact release surfaces
        run: |
          cargo build --release --bin rust-doctor --bin rust-doctor-eval
          cargo build --release --no-default-features --bin rust-doctor --target-dir target/no-default
          cargo build --release --features lsp --bin rust-doctor --target-dir target/lsp
          cargo package --locked
          mkdir -p artifacts
          bash scripts/release/package-native.sh \
            target/release/rust-doctor \
            x86_64-unknown-linux-gnu \
            tar.gz \
            artifacts
          bun scripts/release/packages.ts pack \
            linux-x64 \
            target/release/rust-doctor \
            artifacts

      - name: Prepare pinned public corpus
        if: ${{ steps.source.outputs.checked != 'true' }}
        run: |
          target/release/rust-doctor-eval prepare \
            --manifest evaluation/corpus-v1.json \
            --checkout-root "$RUNNER_TEMP/ep004-corpus" \
            --prepared-out "$RUNNER_TEMP/ep004-prepared.json"

      - name: Scan the corpus with the release binary
        if: ${{ steps.source.outputs.checked != 'true' }}
        run: |
          mkdir -p evidence
          set +e
          scripts/evaluation/run-in-delegated-cgroup.sh \
            env HOME="$HOME" CARGO_HOME="$CARGO_HOME" RUSTUP_HOME="$HOME/.rustup" \
            RUSTUP_TOOLCHAIN=1.97 PATH="$PATH" \
            target/release/rust-doctor-eval corpus \
            --manifest evaluation/corpus-v1.json \
            --prepared "$RUNNER_TEMP/ep004-prepared.json" \
            --checkout-root "$RUNNER_TEMP/ep004-corpus" \
            --binary "$GITHUB_WORKSPACE/target/release/rust-doctor" \
            --tool-revision "${{ steps.source.outputs.revision }}" \
            --output-limit-mib 256 \
            --output "$GITHUB_WORKSPACE/evidence/corpus-candidate.ndjson"
          status=$?
          set -e
          test "$status" -eq 0 || test "$status" -eq 3

      - name: Restore certified corpus evidence
        if: ${{ steps.source.outputs.checked == 'true' }}
        run: |
          mkdir -p evidence
          cp "$RUNNER_TEMP/approved/candidate/evidence/corpus-candidate.ndjson" \
            evidence/corpus-candidate.ndjson

      - name: Capture hash-bound release gates
        env:
          CERT_NO_DEFAULT_BINARY: target/no-default/release/rust-doctor
          CERT_LSP_BINARY: target/lsp/release/rust-doctor
          CERT_CORPUS_BASELINE: ${{ runner.temp }}/approved/corpus/corpus-baseline.ndjson
          CERT_CORPUS_CANDIDATE: evidence/corpus-candidate.ndjson
          CERT_PERFORMANCE_BASELINE: ${{ runner.temp }}/approved/performance/benchmark-baseline.json
        run: |
          version=$(cargo metadata --no-deps --format-version=1 | jq -r '.packages[0].version')
          export CERT_NPM_PLATFORM_PACKAGE="artifacts/rust-doctor-npm-linux-x64-${version}.tgz"
          export CERT_NPM_WRAPPER_PACKAGE="artifacts/rust-doctor-npm-${version}.tgz"
          export CERT_NATIVE_ARCHIVE="artifacts/rust-doctor-x86_64-unknown-linux-gnu.tar.gz"
          export CERT_CRATE_PACKAGE="target/package/rust-doctor-${version}.crate"
          generated_at=$(git show -s --format=%ct HEAD)
          for gate in \
            quality-gates \
            cross-surface \
            artifact-smoke \
            workspace-scale \
            decision-overhead \
            corpus-runtime \
            interruption
          do
            bash scripts/release/certification-gate.sh \
              "$gate" target/release/rust-doctor \
              "${{ steps.source.outputs.revision }}" "$generated_at"
          done
          bash scripts/release/assemble-certification-evidence.sh \
            target/release/rust-doctor \
            "${{ steps.source.outputs.revision }}" \
            "$generated_at" \
            evaluation/release-evidence-v1.json

      - name: Generate and validate certification manifest
        run: |
          generated_at=$(git show -s --format=%ct HEAD)
          target/release/rust-doctor-eval certify \
            --binary target/release/rust-doctor \
            --corpus evidence/corpus-candidate.ndjson \
            --corpus-baseline "$RUNNER_TEMP/approved/corpus/corpus-baseline.ndjson" \
            --tool-revision "${{ steps.source.outputs.revision }}" \
            --generated-at-utc "$generated_at" \
            --output evaluation/certifications/decision-quality-v1.json
          cargo test --bin rust-doctor-eval \
            evaluation::certify::tests::certification_schema_accepts_checked_manifest \
            -- --exact
          if [[ "${{ steps.source.outputs.checked }}" == true ]]; then
            diff -u \
              "${{ steps.source.outputs.expected }}/release-evidence-v1.json" \
              evaluation/release-evidence-v1.json
            diff -ru \
              "${{ steps.source.outputs.expected }}/certifications" \
              evaluation/certifications
          else
            echo "::notice::Generated candidate evidence for source revision ${{ steps.source.outputs.revision }}"
          fi

      - name: Upload certification evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ep004-release-certification
          path: |
            evidence/corpus-candidate.ndjson
            evaluation/release-evidence-v1.json
            evaluation/certifications/
            target/certification/
          if-no-files-found: warn
          retention-days: 90
