name: Release

# Builds the five platform binaries the Node launcher declares in
# npm/rust-doctor/lib/launcher.js and publishes them to npm, so that
# `npx rust-doctor@latest` resolves to the binary for the machine that ran it.
#
# A tag publishes; anything else stops at a dry run, so the candidate stays
# validated between releases. The same tag publishes both channels, npm and
# crates.io, from one commit: the two registries drifted apart once, npm
# restarting at 0.3.0 while crates.io stayed on the 0.2.0 written before this
# rewrite, and a version number that means one thing on one registry and
# another elsewhere is what a single publishing commit prevents. The GitHub
# Release goes out from the same tag, carrying the note written for it under
# `.github/releases/`.
#
# The npm names are not the ones the retired account used. `@rust-doctor/*` was
# transferred to npm-support when that account went away and cannot be
# reclaimed, so the native packages live under `@rustdoctor/*`. Versions 0.1.1
# through 0.2.0 of the unscoped `rust-doctor` were unpublished and are burned
# for good: npm never lets a name@version be reused. That is why the line
# restarts at 0.3.0.
#
# React Doctor's publish.yml is driven by Changesets, which has no analogue for
# a single Rust crate: the version lives in Cargo.toml and the launcher's
# package.json mirrors it (pack-local.mjs fails the build when they disagree),
# so a release is one version bump, not a changeset graph.

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

defaults:
  run:
    shell: bash -euxo pipefail {0}

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          # ubuntu-22.04 rather than ubuntu-latest: the glibc the binary links
          # against is the oldest one it will run on, and `latest` silently
          # moves that floor when GitHub rolls the label forward.
          - platform: linux-x64
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            native: true
          - platform: linux-arm64
            os: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
            native: true
          - platform: darwin-arm64
            os: macos-latest
            target: aarch64-apple-darwin
            native: true
          # Cross-compiled from the Apple Silicon runner: Xcode ships both
          # slices, and GitHub's Intel macOS images are on their way out. The
          # tradeoff is that this leg cannot run the binary it produces, so its
          # smoke step is skipped rather than faked.
          - platform: darwin-x64
            os: macos-latest
            target: x86_64-apple-darwin
            native: false
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: "1.97.1"
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          prefix-key: "v1-rust"
          key: release-${{ matrix.target }}

      - name: Build
        run: cargo build --release --locked --bin rust-doctor --target ${{ matrix.target }}

      # Proves the artifact starts and reports the version Cargo.toml declares,
      # which is the one invariant pack-local.mjs later checks the wrapper
      # manifest against.
      - name: Verify the binary runs
        if: matrix.native
        run: ./target/${{ matrix.target }}/release/rust-doctor --version

      - name: Stage the binary
        run: |
          mkdir -p staging
          cp "target/${{ matrix.target }}/release/rust-doctor" staging/

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: rust-doctor-${{ matrix.platform }}
          path: staging
          if-no-files-found: error
          retention-days: 7

  # Separate from the matrix above rather than a fifth leg with a conditional
  # shell. Every cargo step here must run under pwsh: Git Bash prepends its
  # coreutils `link.exe` to PATH, which shadows the MSVC linker and breaks the
  # link step of any build script in the graph (blake3 carries one).
  build-windows:
    name: win32-x64
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: "1.97.1"
          targets: x86_64-pc-windows-msvc

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          prefix-key: "v1-rust"
          key: release-x86_64-pc-windows-msvc

      - name: Build
        run: cargo build --release --locked --bin rust-doctor --target x86_64-pc-windows-msvc

      - name: Verify the binary runs
        run: .\target\x86_64-pc-windows-msvc\release\rust-doctor.exe --version

      - name: Stage the binary
        run: |
          New-Item -ItemType Directory -Force -Path staging | Out-Null
          Copy-Item target\x86_64-pc-windows-msvc\release\rust-doctor.exe staging\

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: rust-doctor-win32-x64
          path: staging
          if-no-files-found: error
          retention-days: 7

  # The launcher contract, proven against a real install rather than asserted.
  # pack-local.mjs refuses any platform but linux-x64, so this covers one of the
  # five packages end to end, on the only platform this runner can both build
  # and execute. The other four are proven by construction: publish stages every
  # package through the same nativeManifest this smoke test installs from.
  launcher:
    name: Packed launcher proof
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      # Clippy is required, not optional, for the same reason ci.yml states it:
      # the smoke drives a full scan of this repository, and without the
      # component the scan fails, the score loses its authoritative flag, and
      # the report drops the share line the proof reads.
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: "1.97.1"
          components: clippy

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          prefix-key: "v1-rust"
          key: release-launcher

      - uses: oven-sh/setup-bun@f4d14e03ff726c06358e5557344e1da148b56cf7 # v1.2.2
        with:
          bun-version: 1.3.14

      # The smoke's npm leg installs the packed tarballs the way `npm install
      # -g` and the Action do. Node 22.13.0 ships npm 10.9.2, the npm it runs.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22.13.0"

      - name: Packed launcher smoke
        working-directory: npm/rust-doctor
        run: bun run smoke:packed

  # Publishes six packages: the five native ones, then the unscoped wrapper that
  # depends on them. That order is the contract. The wrapper's
  # optionalDependencies name all five at an exact version, so a wrapper that
  # reached the registry first would be installable for a window in which no
  # binary exists to satisfy it.
  #
  # Nothing here is idempotent by npm's design, since a published name@version
  # can never be replaced, so the job skips what the registry already serves
  # rather than failing. That is what makes a re-run after a partial failure
  # safe: it publishes the remainder instead of burning the version.
  publish:
    name: Publish to npm
    needs: [build, build-windows, launcher]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      # npm provenance: the attestation is signed with the workflow's OIDC
      # identity, which is what lets a reader tie the tarball to this commit.
      id-token: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@f4d14e03ff726c06358e5557344e1da148b56cf7 # v1.2.2
        with:
          bun-version: 1.3.14

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22.13.0"
          registry-url: "https://registry.npmjs.org"

      # Trusted publishing needs npm 11.5.1 or later, and Node 22 ships npm 10.
      # The install names one exact npm, as every `uses:` above names a commit:
      # this job holds publish authority, so a new upstream release reaches it
      # only through a reviewed change to this file.
      # The registry authenticates this job by the OIDC identity the six
      # packages each name as their trusted publisher, so no token is stored:
      # a leaked secret cannot publish, and a workflow renamed or moved to
      # another repository stops being trusted rather than staying authorized.
      - name: Upgrade npm to a trusted-publishing build
        run: npm install -g npm@11.21.1

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: artifacts

      # A tag names the version it ships, and disagreeing with the manifest is a
      # release built from the wrong commit rather than a detail to reconcile.
      - name: Resolve the release version
        id: version
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          version="$(node -p "require('./npm/rust-doctor/package.json').version")"
          if [ "$REF_TYPE" = "tag" ] && [ "${REF_NAME#v}" != "$version" ]; then
            echo "tag $REF_NAME does not name version $version" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # All six, the wrapper included: what npm uploads is then exactly what the
      # packed smoke test installs, and the dual license text reaches every
      # tarball rather than staying at the repository root where npm cannot see
      # it.
      - name: Stage the six packages
        working-directory: npm/rust-doctor
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          bun scripts/pack-release.mjs \
            --artifacts "$GITHUB_WORKSPACE/artifacts" \
            --output "$GITHUB_WORKSPACE/release-packages" \
            --expect-version "$VERSION"

      - name: Publish
        env:
          VERSION: ${{ steps.version.outputs.version }}
          RELEASING: ${{ github.ref_type == 'tag' }}
        run: |
          # Absolute directories, never `release-packages/<key>`: npm resolves a
          # bare `a/b` argument as the GitHub shorthand owner/repo and goes
          # looking for a repository instead of publishing the folder.
          # The skip guards the dry-run too, and it has to: `npm publish
          # --dry-run` still asks the registry and refuses a version already
          # published, so a manual run between releases would go red for saying
          # something true. The validation that matters happens on the run
          # after a version bump, where nothing is published yet and every
          # dry-run really executes.
          publish() {
            directory="$1"
            name="$2"
            if npm view "$name@$VERSION" version >/dev/null 2>&1; then
              echo "$name@$VERSION is already on the registry, skipping"
              return 0
            fi
            if [ "$RELEASING" != "true" ]; then
              npm publish "$directory" --access public --provenance --dry-run
              return 0
            fi
            npm publish "$directory" --access public --provenance
          }
          for key in linux-x64 linux-arm64 darwin-x64 darwin-arm64 win32-x64; do
            publish "$GITHUB_WORKSPACE/release-packages/$key" "@rustdoctor/$key"
          done
          publish "$GITHUB_WORKSPACE/release-packages/wrapper" rust-doctor

  crates:
    name: Publish to crates.io
    needs: [build, build-windows, launcher]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      # Trusted publishing, the same arrangement the six npm packages use: the
      # registry authenticates this job by its OIDC identity and mints a token
      # that lives for one run, so nothing is stored and a workflow renamed or
      # moved to another repository stops being trusted rather than staying
      # authorized. It has to be enabled once in the crate settings on
      # crates.io, naming this repository and this workflow file.
      id-token: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: "1.97.1"

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          prefix-key: "v1-rust"
          key: crates-io

      # Cargo.toml is where the version lives; npm/rust-doctor/package.json
      # mirrors it, and the npm job checks the mirror. Both jobs refuse a tag
      # that names something else, so a release built from the wrong commit
      # fails on either side rather than shipping half of itself.
      - name: Resolve the release version
        id: version
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          version="$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')"
          if [ "$REF_TYPE" = "tag" ] && [ "${REF_NAME#v}" != "$version" ]; then
            echo "tag $REF_NAME does not name version $version" >&2
            exit 1
          fi
          # crates.io answers 404 for a version it does not serve, and refuses
          # a request carrying no user agent. A version already on the registry
          # is skipped rather than failed, so a re-run after a partial release
          # finishes it: crates.io never lets a version be republished, and
          # yanking does not free the number either. Anything other than the
          # two expected answers stops the job, because a transport failure
          # read as "not published" is how a release talks itself into an
          # upload the registry is about to refuse.
          status="$(curl -sSL -o /dev/null -w '%{http_code}' \
            -H "user-agent: rust-doctor release workflow (https://github.com/arthjean/rust-doctor)" \
            "https://crates.io/api/v1/crates/rust-doctor/$version")"
          case "$status" in
            200) published=true ;;
            404) published=false ;;
            *) echo "crates.io answered $status for version $version" >&2; exit 1 ;;
          esac
          {
            echo "version=$version"
            echo "published=$published"
          } >> "$GITHUB_OUTPUT"

      # The verification build runs here, in a step that holds no token:
      # `cargo publish` compiles the packaged crate, build scripts and
      # procedural macros included, and nothing it compiles may read the
      # registry credential. `cargo publish --dry-run` never asks the registry,
      # which is where this differs from the npm job, so it stays a real check
      # of the tarball and its build between releases too.
      - name: Verify the package
        run: cargo publish --locked --dry-run

      - uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1.0.6
        id: auth
        if: github.ref_type == 'tag' && steps.version.outputs.published != 'true'

      - name: Publish
        if: github.ref_type == 'tag'
        env:
          VERSION: ${{ steps.version.outputs.version }}
          PUBLISHED: ${{ steps.version.outputs.published }}
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: |
          if [ "$PUBLISHED" = "true" ]; then
            echo "rust-doctor@$VERSION is already on the registry, skipping"
            exit 0
          fi
          # Verified by the step above: the upload compiles nothing.
          cargo publish --locked --no-verify

  # The GitHub Release is published from a note written before the tag, not from
  # the commit subjects. `.github/releases/v<version>.md` is where it lives, and
  # a tag whose note is missing fails this job rather than shipping a release
  # body assembled out of `git log`: the note is part of the release.
  #
  # It runs after both registries, because a release page announcing a version
  # npm or crates.io refused is a claim with nothing behind it. Re-running edits
  # the existing release instead of failing, so a partial run finishes.
  github-release:
    name: GitHub Release
    needs: [publish, crates]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Resolve the release version
        id: version
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          version="$(node -p "require('./npm/rust-doctor/package.json').version")"
          if [ "$REF_TYPE" = "tag" ] && [ "${REF_NAME#v}" != "$version" ]; then
            echo "tag $REF_NAME does not name version $version" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Publish the release note
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          RELEASING: ${{ github.ref_type == 'tag' }}
        run: |
          notes=".github/releases/v$VERSION.md"
          # Checked on every run, tag or not, so a missing note is caught by the
          # candidate build rather than by the release it was supposed to
          # describe.
          if [ ! -s "$notes" ]; then
            echo "$notes is missing or empty; write the release note before tagging" >&2
            exit 1
          fi
          if [ "$RELEASING" != "true" ]; then
            echo "v$VERSION would be released from $notes"
            exit 0
          fi
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            gh release edit "v$VERSION" --title "v$VERSION" --notes-file "$notes" --latest
          else
            gh release create "v$VERSION" --title "v$VERSION" --notes-file "$notes" --latest --verify-tag
          fi

  # What the run shipped, or would have shipped.
  summary:
    name: Release summary
    needs: [build, build-windows, launcher, publish, crates, github-release]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: artifacts

      - name: Describe the candidate
        env:
          REF_TYPE: ${{ github.ref_type }}
        run: |
          {
            if [ "$REF_TYPE" = "tag" ]; then
              echo '## Released'
              echo
              echo 'Published to npm: the five @rustdoctor/<platform> packages, then the rust-doctor wrapper.'
              echo
              echo 'Published to crates.io: the `rust-doctor` crate, from this same commit.'
              echo
              echo 'Published to GitHub: the release note under .github/releases/.'
            else
              echo '## Release candidate'
              echo
              echo 'Built and validated through `npm publish --dry-run` and `cargo publish --dry-run`. Only a tag publishes.'
            fi
            echo
            echo '| Artifact | Size |'
            echo '|---|---|'
            find artifacts -type f -printf '| %p | %s bytes |\n' | sort
          } >> "$GITHUB_STEP_SUMMARY"
