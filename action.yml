name: rust-doctor
description: Scan a Rust workspace with rust-doctor, publish its score and delta as outputs and a job summary, and upload the report.
author: Arthur Jean
branding:
  icon: activity
  color: orange

inputs:
  version:
    description: The rust-doctor version to install through the npm launcher, or `preinstalled` to run the rust-doctor already on PATH.
    required: false
    default: "0.9.0"
  toolchain:
    description: The Rust toolchain to install with Clippy. Defaults to the one this release was validated on.
    required: false
    default: "1.99.1"
  scope:
    description: full, files, lines or baseline. Empty scans a pull request in baseline scope against its base, and anything else in full scope.
    required: false
    default: ""
  base:
    description: "The ref a files, lines or baseline scope compares against. Empty takes the pull request's base, or the default branch the repository answers for. These scopes need the base's history: check out with `fetch-depth: 0`. On a pull request from a shallow checkout, the Action fetches the base itself when the token allows it."
    required: false
    default: ""
  blocking:
    description: none, error or warning. Empty lets the workspace's rust-doctor.toml decide.
    required: false
    default: ""
  warning-exit-code:
    description: "An exit code from 3 to 125 for a scan whose gate passed but that holds a finding `--blocking warning` would block. Like a gate failure, it fails only a pull request. Empty keeps such a scan at 0."
    required: false
    default: ""
  working-directory:
    description: The workspace to scan.
    required: false
    default: "."
  args:
    description: Further rust-doctor arguments, split on whitespace.
    required: false
    default: ""
  cache:
    description: "Restore Cargo's build with Swatinem/rust-cache. Only a run on the default branch saves it, even when the gate fails the job, so the retry is warm; a pull request restores and never saves."
    required: false
    default: "true"

outputs:
  score:
    description: The score out of 100, empty when none was computed.
    value: ${{ steps.outputs.outputs.score }}
  authoritative:
    description: Whether the score is authoritative, true or false.
    value: ${{ steps.outputs.outputs.authoritative }}
  introduced:
    description: Findings the change introduced, in baseline scope. Empty otherwise.
    value: ${{ steps.outputs.outputs.introduced }}
  fixed:
    description: Findings the change fixed, in baseline scope. Empty otherwise.
    value: ${{ steps.outputs.outputs.fixed }}
  exit-code:
    description: The scan's exit code, 0 passed, 1 gate failed or incomplete, 2 failed, or the `warning-exit-code` when one is set and a warning would have blocked.
    value: ${{ steps.scan.outputs.exit-code }}

runs:
  using: composite
  steps:
    - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f
      with:
        toolchain: ${{ inputs.toolchain }}
        components: clippy

    - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
      if: inputs.cache == 'true'
      with:
        workspaces: ${{ inputs.working-directory }}
        cache-on-failure: true
        cache-bin: false
        save-if: ${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}

    - name: Install rust-doctor
      id: install
      if: inputs.version != 'preinstalled'
      shell: bash
      env:
        VERSION: ${{ inputs.version }}
      run: |
        npm install -g "rust-doctor@$VERSION"
        launcher="$(npm prefix -g)/bin/rust-doctor"
        if [ ! -x "$launcher" ]; then
          echo "::error::npm installed no rust-doctor launcher at $launcher."
          exit 1
        fi
        "$launcher" --version
        echo "launcher=$launcher" >> "$GITHUB_OUTPUT"

    - name: Scan
      id: scan
      shell: bash
      env:
        SCOPE: ${{ inputs.scope }}
        BASE: ${{ inputs.base }}
        BLOCKING: ${{ inputs.blocking }}
        WARNING_EXIT_CODE: ${{ inputs.warning-exit-code }}
        ARGS: ${{ inputs.args }}
        WORKSPACE: ${{ inputs.working-directory }}
        PULL_REQUEST_BASE: ${{ github.base_ref }}
        LAUNCHER: ${{ steps.install.outputs.launcher }}
      run: |
        set -uo pipefail
        report="$RUNNER_TEMP/rust-doctor/report.json"
        mkdir -p "$(dirname "$report")"
        echo "report=$report" >> "$GITHUB_OUTPUT"
        scope="$SCOPE"
        base="$BASE"
        if [ -z "$scope" ]; then
          if [ -n "${PULL_REQUEST_BASE:-}" ]; then scope=baseline; else scope=full; fi
        fi
        if [ -z "$base" ] && [ "$scope" != full ] && [ -n "${PULL_REQUEST_BASE:-}" ]; then
          base="origin/$PULL_REQUEST_BASE"
        fi
        if [ "$scope" != full ] && [ -n "${PULL_REQUEST_BASE:-}" ] \
          && [ "$(git -C "$WORKSPACE" rev-parse --is-shallow-repository 2>/dev/null)" = true ]; then
          git -C "$WORKSPACE" fetch --no-tags --unshallow origin \
            "+refs/heads/$PULL_REQUEST_BASE:refs/remotes/origin/$PULL_REQUEST_BASE" || true
        fi
        arguments=("$WORKSPACE" --yes --json --scope "$scope")
        if [ -n "$base" ]; then arguments+=(--base "$base"); fi
        if [ -n "$BLOCKING" ]; then arguments+=(--blocking "$BLOCKING"); fi
        if [ -n "${WARNING_EXIT_CODE:-}" ]; then arguments+=(--warning-exit-code "$WARNING_EXIT_CODE"); fi
        if [ -n "$ARGS" ]; then
          read -r -a extra <<< "$ARGS"
          arguments+=("${extra[@]}")
        fi
        status=0
        "${LAUNCHER:-rust-doctor}" "${arguments[@]}" > "$report" || status=$?
        echo "exit-code=$status" >> "$GITHUB_OUTPUT"

    - name: Summarize
      id: summarize
      if: always()
      shell: bash
      env:
        REPORT: ${{ steps.scan.outputs.report }}
        LAUNCHER: ${{ steps.install.outputs.launcher }}
      run: |
        summary="$RUNNER_TEMP/rust-doctor/summary.md"
        mkdir -p "$(dirname "$summary")"
        if "${LAUNCHER:-rust-doctor}" report markdown "$REPORT" > "$summary"; then
          cat "$summary" >> "$GITHUB_STEP_SUMMARY"
        else
          : > "$summary"
          echo "rust-doctor wrote no report that could be rendered." >> "$GITHUB_STEP_SUMMARY"
        fi
        clean=$(jq -r '.status == "complete" and (if .scope.mode == "baseline" then .delta.summary.introduced == 0 else (.diagnostics | length) == 0 end)' "$REPORT" 2>/dev/null) || clean=false
        if [ "$clean" != true ]; then clean=false; fi
        echo "$clean" > "$RUNNER_TEMP/rust-doctor/clean"
        echo "clean=$clean" >> "$GITHUB_OUTPUT"

    - name: Upload the report
      if: always()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: rust-doctor-report
        path: |
          ${{ runner.temp }}/rust-doctor/report.json
          ${{ runner.temp }}/rust-doctor/summary.md
          ${{ runner.temp }}/rust-doctor/clean
        if-no-files-found: ignore
        retention-days: 7

    - name: Set the outputs
      id: outputs
      if: always()
      shell: bash
      env:
        REPORT: ${{ steps.scan.outputs.report }}
      run: |
        jq -r '
          "score=\(.audit.score.value | numbers // "")",
          "authoritative=\(.audit.score.authoritative | booleans // false)",
          "introduced=\(.delta.summary.introduced | numbers // "")",
          "fixed=\(.delta.summary.fixed | numbers // "")"
        ' "$REPORT" >> "$GITHUB_OUTPUT" || echo "authoritative=false" >> "$GITHUB_OUTPUT"

    - name: Exit with the scan's code
      if: always()
      shell: bash
      env:
        EXIT_CODE: ${{ steps.scan.outputs.exit-code }}
        EVENT_NAME: ${{ github.event_name }}
        WARNING_EXIT_CODE: ${{ inputs.warning-exit-code }}
      run: |
        code="${EXIT_CODE:-2}"
        if { [ "$code" = 1 ] || [ "$code" = "${WARNING_EXIT_CODE:-}" ]; } && [ "${EVENT_NAME:-}" != pull_request ]; then
          echo "::notice::The gate failed, and only a pull request fails on it: this ${EVENT_NAME:-run} reports without failing."
          code=0
        fi
        exit "$code"
