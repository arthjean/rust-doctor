name: CI

on:
  push:
    branches: [master, main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Check & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: stable
          components: clippy, rustfmt

      - name: Check
        run: cargo check

      - name: Clippy (pedantic + nursery)
        run: cargo clippy --all-targets -- -W clippy::all -W clippy::pedantic -W clippy::nursery -D warnings

      - name: Format
        run: cargo fmt --check

      - name: Test
        run: cargo test

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: Security audit
        run: cargo audit

      - name: Install cargo-deny
        run: cargo install cargo-deny --locked

      - name: Supply-chain check (cargo-deny)
        run: cargo deny check

      - name: Publish dry-run
        run: cargo publish --dry-run

  artifact-smoke:
    name: Built artifact smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: stable
          components: clippy

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest

      - name: Build release surfaces
        run: |
          cargo build --release --bin rust-doctor --bin rust-doctor-eval
          cargo build --release --no-default-features --bin rust-doctor --target-dir target/no-default
          cargo package --locked
          mkdir -p artifacts
          bash scripts/release/package-native.sh \
            target/release/rust-doctor \
            x86_64-unknown-linux-gnu \
            tar.gz \
            artifacts
          bun scripts/release/packages.ts pack \
            linux-x64 \
            target/release/rust-doctor \
            artifacts

      - name: Exercise built and final packaged surfaces
        run: |
          version=$(cargo metadata --no-deps --format-version=1 | jq -r '.packages[0].version')
          crate_package=$(find target/package -maxdepth 1 -name 'rust-doctor-*.crate' -print -quit)
          test -n "$crate_package"
          target/release/rust-doctor-eval smoke \
            --binary target/release/rust-doctor \
            --no-default-binary target/no-default/release/rust-doctor \
            --schema schemas/report-v1.schema.json \
            --npm-platform-package "artifacts/rust-doctor-npm-linux-x64-${version}.tgz" \
            --npm-wrapper-package "artifacts/rust-doctor-npm-${version}.tgz" \
            --bun "$(command -v bun)" \
            --archive artifacts/rust-doctor-x86_64-unknown-linux-gnu.tar.gz \
            --crate-package "$crate_package"

  editor-adapters:
    name: Packaged editor adapters
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: stable

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest

      - name: Build the real language server
        run: cargo build --features lsp --bin rust-doctor

      - name: Build, test, package, and exercise VS Code/Cursor adapter
        working-directory: editors/vscode
        env:
          RUST_DOCTOR_LSP_BINARY: ${{ github.workspace }}/target/debug/rust-doctor
        run: |
          bun install --frozen-lockfile
          bun run package

      - name: Build, test, package, and exercise Zed adapter
        working-directory: editors/zed
        env:
          RUST_DOCTOR_LSP_BINARY: ${{ github.workspace }}/target/debug/rust-doctor
        run: bun run package

  release-verification:
    name: Five-platform release verification
    uses: ./.github/workflows/release-verify.yml
