name: Rust Doctor
description: Scan Rust changes with complete baseline, review, status, and SARIF reporting
author: rust-doctor

branding:
  icon: activity
  color: green

inputs:
  directory:
    description: Project directory, absolute or relative to the checkout
    required: false
    default: .
  project:
    description: Comma-separated Cargo package selectors
    required: false
    default: ""
  scope:
    description: Scan scope, one of auto, full, changed, baseline, or staged
    required: false
    default: auto
  blocking:
    description: Lowest blocking severity, one of error, warning, info, or none
    required: false
    default: warning
  require-complete:
    description: Fail when required analysis is incomplete
    required: false
    default: "true"
  comment:
    description: Publish or update the sticky pull-request summary
    required: false
    default: "true"
  review-comments:
    description: Publish changed-line review comments, capped at 50
    required: false
    default: "false"
  commit-status:
    description: Publish the Rust Doctor commit status
    required: false
    default: "true"
  sarif:
    description: Upload canonical findings to GitHub Code Scanning
    required: false
    default: "true"
  version:
    description: Exact Rust Doctor version to install
    required: false
    default: 0.2.0
  max-duration:
    description: Optional wall-clock scan budget in seconds
    required: false
    default: ""
  token:
    description: GitHub token used only by enabled reporting channels
    required: false
    default: ""

outputs:
  score:
    description: Authoritative health score, or empty when unavailable
    value: ${{ steps.scan.outputs.score }}
  errors:
    description: Error finding count
    value: ${{ steps.scan.outputs.errors }}
  warnings:
    description: Warning finding count
    value: ${{ steps.scan.outputs.warnings }}
  outcome:
    description: Report V1 outcome
    value: ${{ steps.scan.outputs.outcome }}
  completeness:
    description: Report V1 completeness state
    value: ${{ steps.scan.outputs.completeness }}
  report-file:
    description: Path to Report V1
    value: ${{ steps.scan.outputs.report-file }}
  sarif-file:
    description: Path to the generated SARIF file
    value: ${{ steps.sarif.outputs.sarif-file }}

runs:
  using: composite
  steps:
    - name: Resolve scope and cache identity
      id: prepare
      shell: bash
      env:
        INPUT_DIRECTORY: ${{ inputs.directory }}
        INPUT_SCOPE: ${{ inputs.scope }}
        INPUT_VERSION: ${{ inputs.version }}
        EVENT_NAME: ${{ github.event_name }}
        PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        REPOSITORY: ${{ github.repository }}
        GH_TOKEN: ${{ inputs.token }}
        RUNNER_TEMP: ${{ runner.temp }}
      run: bash "$GITHUB_ACTION_PATH/scripts/action/prepare.sh"

    - name: Restore Rust Doctor binary
      id: tool-cache
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
      with:
        path: ~/.cargo/bin/rust-doctor
        key: rust-doctor-tool-${{ runner.os }}-${{ runner.arch }}-${{ inputs.version }}

    - name: Install exact Rust Doctor version
      if: steps.tool-cache.outputs.cache-hit != 'true'
      shell: bash
      env:
        INPUT_VERSION: ${{ inputs.version }}
      run: |
        set -euo pipefail
        [[ "$INPUT_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([+-][0-9A-Za-z.-]+)?$ ]] || {
          echo "::error::version must be an exact semantic version"
          exit 1
        }
        if command -v cargo-binstall >/dev/null 2>&1; then
          cargo binstall rust-doctor --no-confirm --locked --version "$INPUT_VERSION"
        else
          cargo install rust-doctor --locked --version "$INPUT_VERSION"
        fi

    - name: Verify installed binary
      shell: bash
      env:
        INPUT_VERSION: ${{ inputs.version }}
      run: |
        set -euo pipefail
        installed=$(rust-doctor --version)
        [[ "$installed" == *" $INPUT_VERSION" ]] || {
          echo "::error::cached binary '$installed' does not match requested version $INPUT_VERSION"
          exit 1
        }

    - name: Restore validated scan cache
      if: steps.prepare.outputs.skip != 'true'
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
      with:
        path: ${{ steps.prepare.outputs.scan-cache-path }}
        key: rust-doctor-scan-${{ runner.os }}-${{ runner.arch }}-${{ inputs.version }}-${{ steps.prepare.outputs.compiler-fingerprint }}-${{ steps.prepare.outputs.ruleset-fingerprint }}-${{ steps.prepare.outputs.config-fingerprint }}

    - name: Run Report V1 scan
      id: scan
      shell: bash
      env:
        INPUT_PROJECT: ${{ inputs.project }}
        INPUT_BLOCKING: ${{ inputs.blocking }}
        INPUT_REQUIRE_COMPLETE: ${{ inputs.require-complete }}
        INPUT_MAX_DURATION: ${{ inputs.max-duration }}
        RESOLVED_SCOPE: ${{ steps.prepare.outputs.scope }}
        REQUESTED_SCOPE: ${{ steps.prepare.outputs.requested-scope }}
        BASE_SHA: ${{ steps.prepare.outputs.base-sha }}
        CHANGED_PATHS_FILE: ${{ steps.prepare.outputs.changed-paths-file }}
        SCAN_ROOT: ${{ steps.prepare.outputs.scan-root }}
        GIT_ROOT: ${{ steps.prepare.outputs.git-root }}
        SKIP_SCAN: ${{ steps.prepare.outputs.skip }}
        DEGRADED_REASON: ${{ steps.prepare.outputs.degraded-reason }}
        RUNNER_TEMP: ${{ runner.temp }}
      run: bash "$GITHUB_ACTION_PATH/scripts/action/scan.sh"

    - name: Render canonical SARIF
      id: sarif
      if: inputs.sarif == 'true' && steps.scan.outputs.report-file != ''
      shell: bash
      env:
        REPORT_FILE: ${{ steps.scan.outputs.report-file }}
        SCAN_ROOT: ${{ steps.prepare.outputs.scan-root }}
        GIT_ROOT: ${{ steps.prepare.outputs.git-root }}
        RUNNER_TEMP: ${{ runner.temp }}
      run: bash "$GITHUB_ACTION_PATH/scripts/action/sarif.sh"

    - name: Upload SARIF
      id: upload-sarif
      if: inputs.sarif == 'true' && steps.sarif.outputs.sarif-file != ''
      continue-on-error: true
      uses: github/codeql-action/upload-sarif@3b0bd1d116c0bde30213346b22d4f634d96a2fb0 # v3
      with:
        sarif_file: ${{ steps.sarif.outputs.sarif-file }}
        category: rust-doctor

    - name: Report unavailable SARIF channel
      if: always() && steps.upload-sarif.outcome == 'failure'
      shell: bash
      run: |
        echo "::warning::Rust Doctor SARIF channel skipped: permission denied or upload unavailable"

    - name: Publish pull-request and status channels
      if: inputs.token != '' && (inputs.comment == 'true' || inputs.review-comments == 'true' || inputs.commit-status == 'true')
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
        REPORT_FILE: ${{ steps.scan.outputs.report-file }}
        COMMENT_ENABLED: ${{ inputs.comment }}
        REVIEW_COMMENTS_ENABLED: ${{ inputs.review-comments }}
        COMMIT_STATUS_ENABLED: ${{ inputs.commit-status }}
        EVENT_NAME: ${{ github.event_name }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        REPOSITORY: ${{ github.repository }}
        COMMIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        BASE_SHA: ${{ steps.prepare.outputs.base-sha }}
        SCAN_ROOT: ${{ steps.prepare.outputs.scan-root }}
        GIT_ROOT: ${{ steps.prepare.outputs.git-root }}
        DEGRADED_REASON: ${{ steps.prepare.outputs.degraded-reason }}
        SERVER_URL: ${{ github.server_url }}
        RUN_ID: ${{ github.run_id }}
        RUN_ATTEMPT: ${{ github.run_attempt }}
        EXIT_CODE: ${{ steps.scan.outputs.exit-code }}
        SKIP_SCAN: ${{ steps.prepare.outputs.skip }}
      run: bash "$GITHUB_ACTION_PATH/scripts/action/report.sh"

    - name: Report unavailable token-backed channels
      if: inputs.token == '' && (inputs.comment == 'true' || inputs.review-comments == 'true' || inputs.commit-status == 'true')
      shell: bash
      env:
        COMMENT_ENABLED: ${{ inputs.comment }}
        REVIEW_COMMENTS_ENABLED: ${{ inputs.review-comments }}
        COMMIT_STATUS_ENABLED: ${{ inputs.commit-status }}
      run: |
        [[ "$COMMENT_ENABLED" != true ]] || echo "::warning::Rust Doctor comment channel skipped: token is unavailable"
        [[ "$REVIEW_COMMENTS_ENABLED" != true ]] || echo "::warning::Rust Doctor review-comment channel skipped: token is unavailable"
        [[ "$COMMIT_STATUS_ENABLED" != true ]] || echo "::warning::Rust Doctor status channel skipped: token is unavailable"

    - name: Enforce scan outcome
      if: always() && steps.scan.outputs.exit-code != '0'
      shell: bash
      run: exit 1
