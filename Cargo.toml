[package]
name = "rust-doctor"
version = "0.3.0"
edition = "2024"
rust-version = "1.95"
publish = false

[lib]
path = "src/lib.rs"

[[bin]]
name = "rust-doctor"
path = "src/main.rs"

[dependencies]
blake3 = "=1.8.5"
cargo_metadata = "=0.23.1"
clap = { version = "=4.6.4", features = ["derive"] }
console = "=0.15.11"
ra_ap_syntax = "=0.0.343"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
toml = { version = "=1.1.4", default-features = false, features = ["parse", "serde", "std"] }
unicode-width = "=0.2.2"

[dev-dependencies]
libc = "=0.2.189"

[profile.release]
overflow-checks = true

[lints.clippy]
panic = "deny"
unimplemented = "deny"
dbg_macro = "deny"
todo = "warn"
unwrap_used = "warn"
expect_used = "warn"
unwrap_in_result = "warn"
