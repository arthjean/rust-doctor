name: Rust Doctor

# The analogue of React Doctor's react-doctor.yml: this repository scans itself
# with the binary built from the commit under review, never from a published
# release. A rule that regresses shows up on the pull request that caused it.
#
# On a pull request the scan runs in baseline mode, which is the mode the tool
# exists for in CI: it materializes the comparison ref in a temporary worktree,
# scans both sides, and reports only what the change introduced. The existing
# backlog is not the contributor's problem.

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: rust-doctor-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

defaults:
  run:
    shell: bash -euxo pipefail {0}

env:
  CARGO_TERM_COLOR: always

jobs:
  scan:
    name: Self-scan
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          # Baseline scope resolves a comparison ref and checks it out into a
          # temporary worktree, so the shallow default clone is not enough.
          fetch-depth: 0
          # The pull request's build scripts run in this job: leave no token
          # in .git/config for them to find.
          persist-credentials: false

      # rust-doctor shells out to `cargo clippy` inside the scanned workspace.
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.97.1"
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: "v1-rust"
          key: dogfood

      - name: Build the scanner under review
        run: |
          cargo build --release --locked --bin rust-doctor
          echo "$PWD/target/release" >> "$GITHUB_PATH"

      # The Action from this checkout, driving the binary just built: its
      # outputs, its job summary and the `rust-doctor-report` artifact that
      # rust-doctor-comment.yml posts on the pull request. A pull request is
      # scanned in baseline scope against its base, a push in full scope.
      - name: Scan
        id: scan
        uses: ./
        with:
          version: preinstalled
