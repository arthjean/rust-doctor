name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  validate:
    name: Validate release contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest
      - name: Validate tag and package versions
        run: bun scripts/release/packages.ts validate "$GITHUB_REF_NAME"

  build:
    name: Build and smoke ${{ matrix.target }}
    needs: validate
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            platform: linux-x64
            archive: tar.gz
            binary: rust-doctor
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
            platform: linux-arm64
            archive: tar.gz
            binary: rust-doctor
          - target: x86_64-apple-darwin
            os: macos-15-intel
            platform: darwin-x64
            archive: tar.gz
            binary: rust-doctor
          - target: aarch64-apple-darwin
            os: macos-14
            platform: darwin-arm64
            archive: tar.gz
            binary: rust-doctor
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            platform: win32-x64
            archive: zip
            binary: rust-doctor.exe
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest

      - name: Build default and no-default artifacts
        shell: bash
        run: |
          cargo build --release --features lsp --target "${{ matrix.target }}" --bin rust-doctor --bin rust-doctor-eval
          cargo build --release --no-default-features --target "${{ matrix.target }}" --target-dir target/no-default --bin rust-doctor
          cargo package --locked
          mkdir -p artifacts
          bash scripts/release/package-native.sh \
            "target/${{ matrix.target }}/release/${{ matrix.binary }}" \
            "${{ matrix.target }}" \
            "${{ matrix.archive }}" \
            artifacts

      - name: Package npm tarballs
        shell: bash
        run: |
          set -euo pipefail
          binary="target/${{ matrix.target }}/release/${{ matrix.binary }}"
          bun scripts/release/packages.ts pack "${{ matrix.platform }}" "$binary" artifacts

      - name: Exercise built and final packaged surfaces
        shell: bash
        run: |
          version=$(cargo metadata --no-deps --format-version=1 | jq -r '.packages[0].version')
          crate_package=$(find target/package -maxdepth 1 -name 'rust-doctor-*.crate' -print -quit)
          test -n "$crate_package"
          target/${{ matrix.target }}/release/rust-doctor-eval smoke \
            --binary target/${{ matrix.target }}/release/${{ matrix.binary }} \
            --no-default-binary target/no-default/${{ matrix.target }}/release/${{ matrix.binary }} \
            --schema schemas/report-v1.schema.json \
            --npm-platform-package "artifacts/rust-doctor-npm-${{ matrix.platform }}-${version}.tgz" \
            --npm-wrapper-package "artifacts/rust-doctor-npm-${version}.tgz" \
            --bun "$(command -v bun)" \
            --archive "artifacts/rust-doctor-${{ matrix.target }}.${{ matrix.archive }}" \
            --crate-package "$crate_package"
          if [[ "${{ matrix.platform }}" != "linux-x64" ]]; then
            rm "artifacts/rust-doctor-npm-${version}.tgz"
          fi

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: rust-doctor-${{ matrix.target }}
          path: artifacts/*
          if-no-files-found: error

  release:
    name: Publish immutable GitHub assets
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Generate machine-readable SHA-256 manifest
        run: bun scripts/release/packages.ts checksums artifacts
      - name: Verify existing assets and stage missing assets
        id: stage-assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-upload existing-assets
          existing_names=$(mktemp)
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release view "$GITHUB_REF_NAME" --json assets --jq '.assets[].name' > "$existing_names"
          fi
          while IFS= read -r -d '' candidate; do
            name=$(basename "$candidate")
            if grep -Fxq -- "$name" "$existing_names"; then
              gh release download "$GITHUB_REF_NAME" --pattern "$name" --dir existing-assets
              if ! cmp --silent "$candidate" "existing-assets/$name"; then
                echo "::error::GitHub release asset $name already exists with different content"
                exit 1
              fi
            else
              cp "$candidate" release-upload/
            fi
          done < <(find artifacts -maxdepth 1 -type f -print0)
          if find release-upload -maxdepth 1 -type f -print -quit | grep -q .; then
            echo 'has-files=true' >> "$GITHUB_OUTPUT"
          else
            echo 'has-files=false' >> "$GITHUB_OUTPUT"
          fi
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        if: steps.stage-assets.outputs.has-files == 'true'
        with:
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: release-upload/*

  publish-crate:
    name: Publish crates.io package
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: stable
      - name: Verify package and registry state without credentials
        id: crate-state
        shell: bash
        run: |
          set -euo pipefail
          version=$(cargo metadata --no-deps --format-version=1 | jq -r '.packages[0].version')
          cargo package --locked
          package="target/package/rust-doctor-${version}.crate"
          local_checksum=$(sha256sum "$package" | cut -d' ' -f1)
          metadata=$(mktemp)
          status=$(curl --silent --show-error --output "$metadata" --write-out '%{http_code}' \
            "https://crates.io/api/v1/crates/rust-doctor/$version")
          case "$status" in
            200)
              registry_checksum=$(jq -r '.version.checksum' "$metadata")
              if [[ "$registry_checksum" != "$local_checksum" ]]; then
                echo "::error::crates.io rust-doctor $version exists with different content"
                exit 1
              fi
              echo "Verified existing rust-doctor $version on crates.io"
              echo 'publish=false' >> "$GITHUB_OUTPUT"
              ;;
            404) echo 'publish=true' >> "$GITHUB_OUTPUT" ;;
            *) echo "::error::crates.io returned HTTP $status"; exit 1 ;;
          esac
      - name: Publish the already verified immutable crate
        if: steps.crate-state.outputs.publish == 'true'
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish --locked --no-verify

  publish-npm:
    name: Verify or publish npm packages
    needs: [release, publish-crate]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Verify existing packages and publish missing immutable artifacts
        env:
          NPM_CONFIG_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: bun scripts/release/packages.ts publish artifacts

  propose-action-major:
    name: Propose action major upgrade
    needs: publish-npm
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: master
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest
      - name: Create draft action-version update
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          branch="release/action-v${version}"
          if gh pr list --head "$branch" --state all --json number --jq 'length > 0' | grep -qx true; then
            echo "Action upgrade proposal already exists"
            exit 0
          fi
          bun scripts/release/packages.ts update-action "$version"
          git switch -c "$branch"
          git config user.name "Arthur Jean"
          git config user.email "ArthurDEV44@users.noreply.github.com"
          git add action.yml
          git commit -m "chore(action): target rust-doctor ${version}"
          git push -u origin "$branch"
          gh pr create --draft \
            --title "chore(action): target rust-doctor ${version}" \
            --body "Update the action default binary to the verified ${version} release." \
            --head "$branch"
