[package]
name = "rust-doctor"
version = "0.3.3"
edition = "2024"
rust-version = "1.95"
description = "Local-first health audit for Cargo workspaces: curated Clippy lints and native detectors, scored out of 100"
license = "MIT OR Apache-2.0"
repository = "https://github.com/arthjean/rust-doctor"
homepage = "https://rust-doctor.com"
documentation = "https://docs.rs/rust-doctor"
readme = "README.md"
keywords = ["clippy", "lint", "code-quality", "health", "diagnostics"]
categories = ["development-tools", "command-line-utilities"]
# What is published is the tool, not the repository around it. The Node
# launcher ships on npm from `npm/`, the PRDs and the agent tooling are how the
# crate is written rather than what it does, and `.github/` is what publishes
# rather than what is published. `skills/` stays: `src/skill.rs` embeds it with
# `include_str!`, so a tarball without it does not compile.
exclude = ["npm/", "tasks/", ".claude/", ".github/"]

[lib]
path = "src/lib.rs"

[[bin]]
name = "rust-doctor"
path = "src/main.rs"

[dependencies]
blake3 = "=1.8.5"
cargo_metadata = "=0.23.1"
clap = { version = "=4.6.4", features = ["derive"] }
console = "=0.15.11"
ra_ap_syntax = "=0.0.343"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
toml = { version = "=1.1.4", default-features = false, features = ["parse", "serde", "std"] }
unicode-width = "=0.2.2"

[dev-dependencies]
libc = "=0.2.189"

[profile.release]
overflow-checks = true

[lints.clippy]
panic = "deny"
unimplemented = "deny"
dbg_macro = "deny"
todo = "warn"
unwrap_used = "warn"
expect_used = "warn"
unwrap_in_result = "warn"
