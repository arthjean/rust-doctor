[package]
name = "rust-doctor"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
path = "src/lib.rs"

[[bin]]
name = "rust-doctor"
path = "src/main.rs"

[dependencies]
blake3 = "=1.8.5"
cargo_metadata = "=0.23.1"
clap = { version = "=4.6.4", features = ["derive"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"

[lints.clippy]
panic = "deny"
unimplemented = "deny"
dbg_macro = "deny"
todo = "warn"
unwrap_used = "warn"
expect_used = "warn"
unwrap_in_result = "warn"
